name: dotnet-ci

on:
  pull_request:
  push:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API
        run: dotnet restore tecair-api/TecAir.Api.csproj

      - name: Restore Tests
        run: dotnet restore tests/TecAir.Api.Tests/TecAir.Api.Tests.csproj

      - name: Build API
        run: dotnet build tecair-api/TecAir.Api.csproj --configuration Release --no-restore

      - name: Build Tests
        run: dotnet build tests/TecAir.Api.Tests/TecAir.Api.Tests.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test tests/TecAir.Api.Tests/TecAir.Api.Tests.csproj --configuration Release --no-build --verbosity normal
