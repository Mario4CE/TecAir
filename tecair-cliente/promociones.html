<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    =====================================
    CONFIGURACIÓN DEL DOCUMENTO
    =====================================
    Página para mostrar promociones y ofertas especiales
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Promociones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .promo-card { border-radius: 10px; overflow: hidden; transition: all 0.3s; cursor: pointer; }
        .promo-card:hover { transform: translateY(-6px); box-shadow: 0 8px 20px rgba(0,0,0,0.15) !important; }
        .promo-imagen { background: linear-gradient(135deg, #0066cc, #004a99); color: white; font-size: 3.5rem; padding: 2rem; text-align: center; min-height: 130px; display: flex; align-items: center; justify-content: center; }
        .filter-btn { padding: 0.4rem 1rem; border: 2px solid #bdc3c7; background: white; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.3s; font-family: 'Nunito', sans-serif; }
        .filter-btn:hover, .filter-btn.active { border-color: #0066cc; background: #0066cc; color: white; }
        .precio-original { text-decoration: line-through; color: #adb5bd; font-size: 0.9rem; }
        .precio-promo { font-size: 1.4rem; font-weight: 800; color: #27ae60; }
    </style>
</head>
<body>
    <!--
    =====================================
    BARRA DE NAVEGACIÓN
    =====================================
    -->
    <nav class="navbar navbar-expand-lg" style="background: linear-gradient(135deg, #0066cc, #004a99);">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white fw-bold fs-4" href="menu.html">✈️ TECAir</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="bi bi-list text-white fs-4"></i>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item"><a class="nav-link text-white" href="menu.html"><i class="bi bi-house me-1"></i>Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="vuelos.html"><i class="bi bi-search me-1"></i>Buscar Vuelos</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="reservaciones.html"><i class="bi bi-journal-check me-1"></i>Mis Reservaciones</a></li>
                    <li class="nav-item"><a class="nav-link text-white active fw-semibold" href="promociones.html"><i class="bi bi-tag me-1"></i>Promociones</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="perfil.html"><i class="bi bi-person me-1"></i>Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" onclick="salir(); return false;"><i class="bi bi-box-arrow-right me-1"></i>Salir</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!--
    =====================================
    CONTENIDO PRINCIPAL: PROMOCIONES
    =====================================
    -->
    <div class="container my-4">
        <h1 class="text-primary fw-bold mb-1"><i class="bi bi-tag-fill me-2"></i>Promociones Especiales</h1>
        <p class="text-muted mb-4">Descubre las mejores ofertas y viaja al mejor precio</p>

        <!--
        FILTROS
        -->
        <div class="d-flex gap-2 mb-4 flex-wrap">
            <button class="filter-btn active" onclick="filtrarPromociones('todas', this)">Todas</button>
            <button class="filter-btn" onclick="filtrarPromociones('estudiantes', this)">
                <i class="bi bi-mortarboard me-1"></i>Para Estudiantes
            </button>
            <button class="filter-btn" onclick="filtrarPromociones('vigentes', this)">
                <i class="bi bi-clock me-1"></i>Vigentes Ahora
            </button>
        </div>

        <!--
        GRID DE PROMOCIONES
        -->
        <div id="promocionesGrid" class="row g-3">
            <!-- Se cargan aquí las promociones -->
        </div>
    </div>

    <!--
    MODAL DE DETALLE DE PROMOCIÓN
    -->
    <div class="modal fade" id="modalPromocion" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-0" id="detallePromocion">
                    <!-- Detalles se cargan aquí -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5">
        <p>&copy; 2026 TECAir. Instituto Tecnológico de Costa Rica. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const promociones = [
            { id: 1, origen: 'San José', destino: 'Liberia', descuento: 30, precioOriginal: 150, precioPromocional: 105, validos: 'May 1 - May 31, 2026', estudiantes: true, imagen: '🏖️', descripcion: 'Vuela a las playas de Guanacaste con 30% de descuento' },
            { id: 2, origen: 'San José', destino: 'Limón', descuento: 25, precioOriginal: 120, precioPromocional: 90, validos: 'May 1 - May 15, 2026', estudiantes: false, imagen: '🌴', descripcion: 'Caribe a tu alcance con tarifa promocional' },
            { id: 3, origen: 'San José', destino: 'Quepos', descuento: 35, precioOriginal: 140, precioPromocional: 91, validos: 'May 10 - May 25, 2026', estudiantes: true, imagen: '🏝️', descripcion: 'Descuento especial para estudiantes en ruta Quepos' },
            { id: 4, origen: 'Liberia', destino: 'San José', descuento: 20, precioOriginal: 150, precioPromocional: 120, validos: 'May 5 - May 30, 2026', estudiantes: false, imagen: '✈️', descripcion: 'Promoción en vuelos de regreso' },
            { id: 5, origen: 'San José', destino: 'Palmar', descuento: 40, precioOriginal: 100, precioPromocional: 60, validos: 'May 1 - May 10, 2026', estudiantes: true, imagen: '🌊', descripcion: 'Súper descuento para estudiantes en Palmar' }
        ];

        let promocionesActuales = promociones;

        document.addEventListener('DOMContentLoaded', function() {
            // protegerRuta(); // Desactivado para fase de prueba
            mostrarPromociones(promocionesActuales);
        });

        function mostrarPromociones(lista) {
            const grid = document.getElementById('promocionesGrid');

            if (lista.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><i class="bi bi-tag fs-1 d-block mb-2"></i>No hay promociones disponibles</div>';
                return;
            }

            let html = '';
            lista.forEach(promo => {
                html += `
                <div class="col-sm-6 col-lg-4">
                    <div class="card shadow-sm promo-card h-100" onclick="abrirModal(${promo.id})">
                        <div class="promo-imagen">${promo.imagen}</div>
                        <div class="card-body d-flex flex-column">
                            <h6 class="fw-bold">${promo.origen} → ${promo.destino}</h6>
                            <p class="text-muted small flex-grow-1">${promo.descripcion}</p>
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <span class="precio-original">$${promo.precioOriginal}</span>
                                <span class="precio-promo">$${promo.precioPromocional}</span>
                            </div>
                            <div class="d-flex gap-2 mb-2">
                                <span class="badge bg-danger">-${promo.descuento}%</span>
                                ${promo.estudiantes ? '<span class="badge bg-success">👨‍🎓 Estudiantes</span>' : ''}
                            </div>
                            <p class="text-muted small mb-3"><i class="bi bi-calendar me-1"></i>${promo.validos}</p>
                            <button class="btn btn-success btn-sm w-100">Ver Más</button>
                        </div>
                    </div>
                </div>`;
            });

            grid.innerHTML = html;
        }

        function filtrarPromociones(filtro, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (filtro === 'estudiantes') {
                promocionesActuales = promociones.filter(p => p.estudiantes);
            } else {
                promocionesActuales = promociones;
            }

            mostrarPromociones(promocionesActuales);
        }

        function abrirModal(promoId) {
            const promo = promociones.find(p => p.id === promoId);
            if (!promo) return;

            document.getElementById('detallePromocion').innerHTML = `
                <div class="text-center mb-3" style="font-size:4rem;">${promo.imagen}</div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="fw-bold mb-0">${promo.origen} → ${promo.destino}</h5>
                    <span class="badge bg-danger fs-6">-${promo.descuento}%</span>
                </div>
                <p class="text-muted">${promo.descripcion}</p>
                <div class="bg-light rounded p-3 mb-3">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Precio Original:</span><strong>$${promo.precioOriginal}</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Precio Promocional:</span><strong class="text-success fs-5">$${promo.precioPromocional}</strong>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>Ahorras:</span><strong class="text-danger">$${promo.precioOriginal - promo.precioPromocional}</strong>
                    </div>
                </div>
                <p class="small text-muted mb-1"><i class="bi bi-calendar me-1"></i><strong>Válido:</strong> ${promo.validos}</p>
                ${promo.estudiantes ? '<p class="small text-success mb-3">✓ Disponible para estudiantes</p>' : '<div class="mb-3"></div>'}
                <button class="btn btn-primary w-100 fw-bold" onclick="reservarPromo(${promo.id})">
                    <i class="bi bi-airplane me-2"></i>Reservar Ahora
                </button>`;

            new bootstrap.Modal(document.getElementById('modalPromocion')).show();
        }

        function reservarPromo(promoId) {
            const promo = promociones.find(p => p.id === promoId);
            sessionStorage.setItem('promocionSeleccionada', JSON.stringify(promo));
            bootstrap.Modal.getInstance(document.getElementById('modalPromocion')).hide();
            alert('Redirigiendo a búsqueda de vuelos...');
            window.location.href = 'vuelos.html';
        }
    </script>
</body>
</html>
