<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    =====================================
    CONFIGURACIÓN DEL DOCUMENTO
    =====================================
    Página para mostrar promociones y ofertas especiales
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Promociones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .promo-card { border-radius: 10px; overflow: hidden; transition: all 0.3s; cursor: pointer; }
        .promo-card:hover { transform: translateY(-6px); box-shadow: 0 8px 20px rgba(0,0,0,0.15) !important; }
        .promo-imagen { background: linear-gradient(135deg, #0066cc, #004a99); color: white; font-size: 3.5rem; padding: 2rem; text-align: center; min-height: 130px; display: flex; align-items: center; justify-content: center; }
        .filter-btn { padding: 0.4rem 1rem; border: 2px solid #bdc3c7; background: white; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.3s; font-family: 'Nunito', sans-serif; }
        .filter-btn:hover, .filter-btn.active { border-color: #0066cc; background: #0066cc; color: white; }
        .precio-promo { font-size: 1.4rem; font-weight: 800; color: #27ae60; }
    </style>
</head>
<body>
    <!--
    =====================================
    BARRA DE NAVEGACIÓN
    =====================================
    -->
    <nav class="navbar navbar-expand-lg" style="background: linear-gradient(135deg, #0066cc, #004a99);">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white fw-bold fs-4" href="menu.html">✈️ TECAir</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="bi bi-list text-white fs-4"></i>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item"><a class="nav-link text-white" href="menu.html"><i class="bi bi-house me-1"></i>Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="vuelos.html"><i class="bi bi-search me-1"></i>Buscar Vuelos</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="reservaciones.html"><i class="bi bi-journal-check me-1"></i>Mis Reservaciones</a></li>
                    <li class="nav-item"><a class="nav-link text-white active fw-semibold" href="promociones.html"><i class="bi bi-tag me-1"></i>Promociones</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="perfil.html"><i class="bi bi-person me-1"></i>Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" onclick="salir(); return false;"><i class="bi bi-box-arrow-right me-1"></i>Salir</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!--
    =====================================
    CONTENIDO PRINCIPAL: PROMOCIONES
    =====================================
    -->
    <div class="container my-4">
        <h1 class="text-primary fw-bold mb-1"><i class="bi bi-tag-fill me-2"></i>Promociones Especiales</h1>
        <p class="text-muted mb-4">Descubre las mejores ofertas y viaja al mejor precio</p>

        <!--
        FILTROS
        Permite filtrar promociones por categoría
        -->
        <div class="d-flex gap-2 mb-4 flex-wrap">
            <button class="filter-btn active" onclick="filtrarPromociones('todas', this)">Todas</button>
            <button class="filter-btn" onclick="filtrarPromociones('vigentes', this)">
                <i class="bi bi-clock me-1"></i>Vigentes Ahora
            </button>
        </div>

        <!--
        INDICADOR DE CARGA
        Se muestra mientras se obtienen las promociones de la API
        -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Cargando promociones...</p>
        </div>

        <!--
        GRID DE PROMOCIONES
        Se cargan dinámicamente desde la API
        -->
        <div id="promocionesGrid" class="row g-3" style="display:none;">
            <!-- Se cargan aquí las promociones -->
        </div>
    </div>

    <!--
    MODAL DE DETALLE DE PROMOCIÓN
    Muestra información detallada de una promoción seleccionada
    -->
    <div class="modal fade" id="modalPromocion" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-0" id="detallePromocion">
                    <!-- Detalles se cargan aquí -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5">
        <p>&copy; 2026 TECAir. Instituto Tecnológico de Costa Rica. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        /*
        =====================================
        VARIABLES GLOBALES
        =====================================
        Almacenan las promociones cargadas desde la API
        para poder filtrarlas sin hacer nuevas llamadas
        */
        let todasLasPromociones = [];
        let promocionesActuales = [];

        /*
        =====================================
        INICIALIZACIÓN
        =====================================
        Carga las promociones desde la API al abrir la página
        */
        document.addEventListener('DOMContentLoaded', async function() {
            // protegerRuta(); // Desactivado para fase de prueba
            await cargarPromociones();
        });

        /**
         * Carga las promociones desde la API y las muestra en pantalla
         * Si la API falla, muestra un mensaje de error
         */
        async function cargarPromociones() {
            try {
                // Mostrar spinner mientras carga
                document.getElementById('loading').style.display = 'block';
                document.getElementById('promocionesGrid').style.display = 'none';

                // Llamada real a la API
                const respuesta = await obtenerPromociones();
                todasLasPromociones = respuesta.promociones || [];
                promocionesActuales = todasLasPromociones;

                mostrarPromociones(promocionesActuales);
            } catch (error) {
                console.error('Error cargando promociones:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-exclamation-circle fs-1 d-block mb-2 text-danger"></i>
                        No se pudieron cargar las promociones. Verificá que la API esté corriendo.
                    </div>`;
            }
        }

        /**
         * Muestra una lista de promociones en el grid
         * @param {Array} lista - Lista de promociones a mostrar
         */
        function mostrarPromociones(lista) {
            const grid = document.getElementById('promocionesGrid');
            document.getElementById('loading').style.display = 'none';
            grid.style.display = 'flex';

            if (lista.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><i class="bi bi-tag fs-1 d-block mb-2"></i>No hay promociones disponibles</div>';
                return;
            }

            let html = '';
            lista.forEach(promo => {
                // Elegir ícono según destino
                const iconos = ['🏖️', '🌴', '🏝️', '✈️', '🌊', '🏔️', '🌅'];
                const icono = iconos[promo.idPromocion % iconos.length] || '✈️';

                // Formatear fechas
                const fechaInicio = promo.fechaInicio ? new Date(promo.fechaInicio).toLocaleDateString('es-CR') : '';
                const fechaFin = promo.fechaFin ? new Date(promo.fechaFin).toLocaleDateString('es-CR') : '';
                const validez = fechaInicio && fechaFin ? `${fechaInicio} - ${fechaFin}` : 'Consultar vigencia';

                html += `
                <div class="col-sm-6 col-lg-4">
                    <div class="card shadow-sm promo-card h-100" onclick="abrirModal(${promo.idPromocion})">
                        <div class="promo-imagen">${promo.imagen || icono}</div>
                        <div class="card-body d-flex flex-column">
                            <h6 class="fw-bold">${promo.origen} → ${promo.destino}</h6>
                            <p class="text-muted small flex-grow-1">Ruta promocional</p>
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <span class="precio-promo">$${promo.precio}</span>
                            </div>
                            <p class="text-muted small mb-3"><i class="bi bi-calendar me-1"></i>${validez}</p>
                            <button class="btn btn-success btn-sm w-100">Ver Más</button>
                        </div>
                    </div>
                </div>`;
            });

            grid.innerHTML = html;
        }

        /**
         * Filtra las promociones según el criterio seleccionado
         * @param {string} filtro - Tipo de filtro ('todas' o 'vigentes')
         * @param {HTMLElement} btn - Botón que fue clickeado
         */
        function filtrarPromociones(filtro, btn) {
            // Actualizar botones activos
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (filtro === 'vigentes') {
                const hoy = new Date();
                promocionesActuales = todasLasPromociones.filter(p => {
                    if (!p.fechaFin) return true;
                    return new Date(p.fechaFin) >= hoy;
                });
            } else {
                promocionesActuales = todasLasPromociones;
            }

            mostrarPromociones(promocionesActuales);
        }

        /**
         * Abre el modal con el detalle de una promoción
         * @param {number} promoId - ID de la promoción a mostrar
         */
        function abrirModal(promoId) {
            const promo = todasLasPromociones.find(p => p.idPromocion === promoId);
            if (!promo) return;

            const iconos = ['🏖️', '🌴', '🏝️', '✈️', '🌊', '🏔️', '🌅'];
            const icono = iconos[promo.idPromocion % iconos.length] || '✈️';
            const fechaInicio = promo.fechaInicio ? new Date(promo.fechaInicio).toLocaleDateString('es-CR') : '';
            const fechaFin = promo.fechaFin ? new Date(promo.fechaFin).toLocaleDateString('es-CR') : '';
            const validez = fechaInicio && fechaFin ? `${fechaInicio} - ${fechaFin}` : 'Consultar vigencia';

            document.getElementById('detallePromocion').innerHTML = `
                <div class="text-center mb-3" style="font-size:4rem;">${promo.imagen || icono}</div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="fw-bold mb-0">${promo.origen} → ${promo.destino}</h5>
                </div>
                <div class="bg-light rounded p-3 mb-3">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Precio Promocional:</span>
                        <strong class="text-success fs-5">$${promo.precio}</strong>
                    </div>
                </div>
                <p class="small text-muted mb-3">
                    <i class="bi bi-calendar me-1"></i><strong>Válido:</strong> ${validez}
                </p>
                <button class="btn btn-primary w-100 fw-bold" onclick="reservarPromo(${promo.idPromocion})">
                    <i class="bi bi-airplane me-2"></i>Reservar Ahora
                </button>`;

            new bootstrap.Modal(document.getElementById('modalPromocion')).show();
        }

        /**
         * Guarda la promoción seleccionada y redirige a búsqueda de vuelos
         * @param {number} promoId - ID de la promoción seleccionada
         */
        function reservarPromo(promoId) {
            const promo = todasLasPromociones.find(p => p.idPromocion === promoId);
            sessionStorage.setItem('promocionSeleccionada', JSON.stringify(promo));
            bootstrap.Modal.getInstance(document.getElementById('modalPromocion')).hide();
            window.location.href = 'vuelos.html';
        }
    </script>
</body>
</html>
