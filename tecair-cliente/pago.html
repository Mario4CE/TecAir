<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    =====================================
    CONFIGURACIÓN DEL DOCUMENTO
    =====================================
    Página de procesamiento de pagos para reservaciones de vuelos
    El pago se registra en la API mediante POST /api/pagos
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .metodo-pago { border: 2px solid #dee2e6; border-radius: 8px; padding: 0.9rem 1rem; cursor: pointer; transition: all 0.25s; }
        .metodo-pago:hover { border-color: #0066cc; background: #f0f7ff; }
        .metodo-pago.active { border-color: #0066cc; background: #f0f7ff; }
        .desglose-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #e9ecef; font-size: 0.9rem; }
        .desglose-item.total { font-weight: 800; font-size: 1rem; color: #0066cc; border-bottom: 2px solid #0066cc; }
    </style>
</head>
<body>
    <!--
    =====================================
    BARRA DE NAVEGACIÓN
    =====================================
    Menú reducido durante el proceso de pago
    -->
    <nav class="navbar" style="background: linear-gradient(135deg, #0066cc, #004a99);">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white fw-bold fs-4" href="menu.html">✈️ TECAir</a>
            <span class="text-white small opacity-75"><i class="bi bi-lock-fill me-1"></i>Pago Seguro</span>
        </div>
    </nav>

    <!--
    =====================================
    CONTENIDO PRINCIPAL: FORMULARIO DE PAGO
    =====================================
    Resumen de la reservación y métodos de pago disponibles
    -->
    <div class="container my-4">
        <h1 class="text-primary fw-bold mb-4"><i class="bi bi-credit-card me-2"></i>Resumen de Pago</h1>

        <div class="row g-4">
            <!--
            COLUMNA IZQUIERDA: RESUMEN Y DESGLOSE DE COSTOS
            Los datos vienen del sessionStorage guardado en reservaciones.html
            -->
            <div class="col-lg-5">
                <!--
                TARJETA 1: DETALLES DE RESERVACIÓN
                -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h6 class="fw-bold text-primary mb-3"><i class="bi bi-airplane me-2"></i>Detalles de tu Reservación</h6>
                        <div id="detallesReservacion" class="small">
                            <!-- Se cargan aquí los detalles -->
                        </div>
                    </div>
                </div>

                <!--
                TARJETA 2: DESGLOSE DE COSTOS
                Calcula impuestos y cargo de servicio sobre la tarifa base
                -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6 class="fw-bold text-primary mb-3"><i class="bi bi-receipt me-2"></i>Desglose de Costos</h6>
                        <div class="desglose-item">
                            <span>Tarifa Base</span><span id="tarifaBase">$0</span>
                        </div>
                        <div class="desglose-item">
                            <span>Impuestos y Tasas (13%)</span><span id="impuestos">$0</span>
                        </div>
                        <div class="desglose-item">
                            <span>Cargo de Servicio</span><span id="cargo">$0</span>
                        </div>
                        <div class="desglose-item total mt-1">
                            <span>Total a Pagar</span><span id="montoTotal">$0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!--
            COLUMNA DERECHA: MÉTODOS Y FORMULARIO DE PAGO
            Al confirmar se llama a POST /api/pagos y POST /api/reservaciones
            -->
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6 class="fw-bold text-primary mb-3"><i class="bi bi-wallet2 me-2"></i>Información de Pago</h6>

                        <!--
                        SELECTOR DE MÉTODOS DE PAGO
                        Tres opciones: Tarjeta, Transferencia, SINPE Móvil
                        -->
                        <div class="d-flex flex-column gap-2 mb-4">
                            <label class="metodo-pago active d-flex align-items-center gap-2" onclick="seleccionarMetodo('tarjeta', this)">
                                <input type="radio" name="metodo" value="tarjeta" checked>
                                <span>💳 Tarjeta de Crédito/Débito</span>
                            </label>
                            <label class="metodo-pago d-flex align-items-center gap-2" onclick="seleccionarMetodo('transferencia', this)">
                                <input type="radio" name="metodo" value="transferencia">
                                <span>🏦 Transferencia Bancaria</span>
                            </label>
                            <label class="metodo-pago d-flex align-items-center gap-2" onclick="seleccionarMetodo('sinpe', this)">
                                <input type="radio" name="metodo" value="sinpe">
                                <span>📱 SINPE Móvil</span>
                            </label>
                        </div>

                        <!--
                        FORMULARIO PARA TARJETA DE CRÉDITO/DÉBITO
                        Solicita datos del titular y número de tarjeta
                        -->
                        <form id="formTarjeta">
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="titularTarjeta">Nombre del Titular</label>
                                <input type="text" class="form-control" id="titularTarjeta" name="titularTarjeta" placeholder="Juan Pérez García" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="numeroTarjeta">Número de Tarjeta</label>
                                <input type="text" class="form-control" id="numeroTarjeta" name="numeroTarjeta" placeholder="4111 1111 1111 1111" maxlength="19" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-semibold" for="expiracion">Vencimiento</label>
                                    <input type="text" class="form-control" id="expiracion" name="expiracion" placeholder="MM/AA" maxlength="5" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-semibold" for="cvv">CVV</label>
                                    <input type="text" class="form-control" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold" for="cedulaTitular">Cédula del Titular</label>
                                <input type="text" class="form-control" id="cedulaTitular" name="cedulaTitular" placeholder="123456789" required>
                            </div>
                        </form>

                        <!-- Términos y Condiciones -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="aceptarTerminos" required>
                            <label class="form-check-label small" for="aceptarTerminos">
                                Acepto los términos y condiciones de TECAir
                            </label>
                        </div>

                        <div id="alertaError" class="alert alert-danger d-none"></div>
                        <div id="alertaExito" class="alert alert-success d-none"></div>

                        <!-- Botones de Acción -->
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-secondary" onclick="cancelarPago()">
                                <i class="bi bi-arrow-left me-1"></i>Cancelar
                            </button>
                            <button type="button" class="btn btn-primary flex-grow-1 fw-bold" id="btnPagar" onclick="procesarPago()">
                                <i class="bi bi-lock-fill me-2"></i>Procesar Pago
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5">
        <p>&copy; 2026 TECAir. Instituto Tecnológico de Costa Rica. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        /*
        =====================================
        VARIABLES GLOBALES
        =====================================
        Almacena los datos de la reservación temporal
        y el monto total calculado para enviar a la API
        */
        let montoTotal = 0;
        let reservacionTemporal = {};

        /*
        =====================================
        INICIALIZACIÓN
        =====================================
        Carga los detalles de la reservación desde sessionStorage
        */
        document.addEventListener('DOMContentLoaded', function() {
            cargarDetallesReservacion();
            formatearInputos();
        });

        /**
         * Carga los detalles de la reservación desde sessionStorage
         * y calcula el desglose de costos
         */
        function cargarDetallesReservacion() {
            reservacionTemporal = JSON.parse(sessionStorage.getItem('reservacionTemporal') || '{}');
            const tarifa = reservacionTemporal.monto || 95;
            const impuestos = Math.round(tarifa * 0.13);
            const cargo = 5;
            montoTotal = tarifa + impuestos + cargo;

            document.getElementById('detallesReservacion').innerHTML = `
                <p class="mb-1"><strong>Pasajero:</strong> ${reservacionTemporal.pasajero || 'No especificado'}</p>
                <p class="mb-1"><strong>Vuelo:</strong> ${reservacionTemporal.textoVuelo || reservacionTemporal.idVuelo || '--'}</p>
                <p class="mb-1"><strong>Asiento:</strong> ${reservacionTemporal.asiento || '--'}</p>`;

            document.getElementById('tarifaBase').textContent = `$${tarifa}`;
            document.getElementById('impuestos').textContent = `$${impuestos}`;
            document.getElementById('cargo').textContent = `$${cargo}`;
            document.getElementById('montoTotal').textContent = `$${montoTotal}`;
        }

        /**
         * Selecciona el método de pago activo
         * @param {string} metodo - Método seleccionado (tarjeta, transferencia, sinpe)
         * @param {HTMLElement} el - Elemento clickeado
         */
        function seleccionarMetodo(metodo, el) {
            document.querySelectorAll('.metodo-pago').forEach(m => m.classList.remove('active'));
            el.classList.add('active');
            document.querySelector(`input[value="${metodo}"]`).checked = true;
        }

        /**
         * Configura los formateadores de los inputs de tarjeta
         * Formatea número de tarjeta, fecha de vencimiento y CVV
         */
        function formatearInputos() {
            // Formatear número de tarjeta con espacios cada 4 dígitos
            document.getElementById('numeroTarjeta').addEventListener('input', function(e) {
                let valor = e.target.value.replace(/\s/g, '');
                let formateado = valor.match(/.{1,4}/g)?.join(' ') || valor;
                e.target.value = formateado;
            });

            // Formatear fecha de vencimiento MM/AA
            document.getElementById('expiracion').addEventListener('input', function(e) {
                let valor = e.target.value.replace(/\D/g, '');
                if (valor.length >= 2) valor = valor.substring(0, 2) + '/' + valor.substring(2, 4);
                e.target.value = valor;
            });

            // Solo números en CVV
            document.getElementById('cvv').addEventListener('input', function(e) {
                e.target.value = e.target.value.replace(/\D/g, '');
            });
        }

        /**
         * Procesa el pago creando primero la reservación y luego el pago en la API
         * Flujo: POST /api/reservaciones → POST /api/pagos
         */
        async function procesarPago() {
            const aceptarTerminos = document.getElementById('aceptarTerminos').checked;
            if (!aceptarTerminos) {
                mostrarAlerta('Debes aceptar los términos y condiciones', 'error');
                return;
            }

            const numeroTarjeta = document.getElementById('numeroTarjeta').value.replace(/\s/g, '');
            if (numeroTarjeta.length < 13 || numeroTarjeta.length > 16) {
                mostrarAlerta('Número de tarjeta inválido', 'error');
                return;
            }

            const btn = document.getElementById('btnPagar');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Procesando...';

            try {
                const usuario = obtenerUsuarioActual();
                const idUsuario = usuario?.idUsuario || 1;
                const metodo = document.querySelector('input[name="metodo"]:checked').value;

                // Paso 1: Crear la reservación en la API
             const respReservacion = await crearReservacion({
                id_usuario: idUsuario,
                id_vuelo: parseInt(reservacionTemporal.idVuelo)
});
                const idReservacion = respReservacion.reservacion?.id_reservacion || respReservacion.id_reservacion;

                // Paso 2: Registrar el pago en la API
                await apiPost('pagos', {
                    id_reservacion: idReservacion,
                     monto: montoTotal,
                     metodo: metodo
                    });

                // Pago exitoso
                mostrarAlerta('¡Pago procesado exitosamente! 🎉', 'exito');
                sessionStorage.removeItem('reservacionTemporal');

                setTimeout(() => {
                    window.location.href = 'reservaciones.html';
                }, 2000);

            } catch (error) {
                console.error('Error procesando pago:', error);
                mostrarAlerta('Error al procesar el pago: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-lock-fill me-2"></i>Procesar Pago';
            }
        }

        /**
         * Cancela la transacción y regresa a reservaciones
         */
        function cancelarPago() {
            if (confirm('¿Deseas cancelar esta transacción?')) {
                sessionStorage.removeItem('reservacionTemporal');
                window.location.href = 'reservaciones.html';
            }
        }

        /**
         * Muestra una alerta de error o éxito
         * @param {string} mensaje - Texto a mostrar
         * @param {string} tipo - Tipo de alerta ('error' o 'exito')
         */
        function mostrarAlerta(mensaje, tipo) {
            const alertaError = document.getElementById('alertaError');
            const alertaExito = document.getElementById('alertaExito');
            alertaError.classList.add('d-none');
            alertaExito.classList.add('d-none');

            if (tipo === 'error') {
                alertaError.textContent = mensaje;
                alertaError.classList.remove('d-none');
            } else {
                alertaExito.textContent = mensaje;
                alertaExito.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
