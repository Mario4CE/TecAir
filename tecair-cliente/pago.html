<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    =====================================
    CONFIGURACIÓN DEL DOCUMENTO
    =====================================
    Página de procesamiento de pagos para reservaciones de vuelos
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Pago</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!--
    =====================================
    BARRA DE NAVEGACIÓN
    =====================================
    Menú reducido (sin opciones) durante el proceso de pago
    -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <h2>✈️ TECAir</h2>
            </div>
        </div>
    </nav>

    <!--
    =====================================
    CONTENIDO PRINCIPAL: FORMULARIO DE PAGO
    =====================================
    Resumen de la reservación y métodos de pago disponibles
    -->
    <div class="container">
        <div class="pago-section">
            <h1>Resumen de Pago</h1>

            <div class="pago-container">
                <!--
                COLUMNA IZQUIERDA: RESUMEN Y DESGLOSE
                Muestra detalles de la reservación y costos desglosados
                -->
                <div class="pago-resumen">
                    <!--
                    TARJETA 1: DETALLES DE RESERVACIÓN
                    Información del vuelo seleccionado
                    -->
                    <div class="card">
                        <h3>Detalles de tu Reservación</h3>
                        <div id="detallesReservacion" class="detalles-grid">
                            <!-- Se cargan aquí los detalles -->
                        </div>
                    </div>

                    <!--
                    TARJETA 2: DESGLOSE DE COSTOS
                    Muestra tarifa base, impuestos, cargos y total
                    -->
                    <div class="card">
                        <h3>Desglose de Costos</h3>
                        <div class="desglose-costos">
                            <div class="desglose-item">
                                <span>Tarifa Base</span>
                                <span id="tarifaBase">$0</span>
                            </div>
                            <div class="desglose-item">
                                <span>Impuestos y Tasas</span>
                                <span id="impuestos">$0</span>
                            </div>
                            <div class="desglose-item">
                                <span>Cargo de Servicio</span>
                                <span id="cargo">$0</span>
                            </div>
                            <hr>
                            <div class="desglose-item total">
                                <span>Total a Pagar</span>
                                <span id="montoTotal">$0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!--
                COLUMNA DERECHA: MÉTODOS Y FORMULARIO DE PAGO
                Selección de método de pago y formulario correspondiente
                -->
                <div class="formulario-pago">
                    <div class="card">
                        <h3>Información de Pago</h3>
                        
                        <!--
                        SELECTOR DE MÉTODOS DE PAGO
                        Tres opciones: Tarjeta, Transferencia, SINPE Móvil
                        -->
                        <div class="metodos-pago">
                            <label class="metodo-pago active" onclick="seleccionarMetodo('tarjeta')">
                                <input type="radio" name="metodo" value="tarjeta" checked>
                                <span>💳 Tarjeta de Crédito/Débito</span>
                            </label>
                            <label class="metodo-pago" onclick="seleccionarMetodo('transferencia')">
                                <input type="radio" name="metodo" value="transferencia">
                                <span>🏦 Transferencia Bancaria</span>
                            </label>
                            <label class="metodo-pago" onclick="seleccionarMetodo('sinpe')">
                                <input type="radio" name="metodo" value="sinpe">
                                <span>📱 SINPE Móvil</span>
                            </label>
                        </div>

                        <!--
                        FORMULARIO PARA TARJETA DE CRÉDITO/DÉBITO
                        Solicita datos del titular y número de tarjeta
                        -->
                        <form id="formTarjeta" class="pago-form">
                            <div class="form-group col-full">
                                <label for="titularTarjeta">Nombre del Titular</label>
                                <input type="text" id="titularTarjeta" name="titularTarjeta" 
                                    placeholder="Juan Pérez García" required>
                            </div>

                            <div class="form-group col-full">
                                <label for="numeroTarjeta">Número de Tarjeta</label>
                                <input type="text" id="numeroTarjeta" name="numeroTarjeta" 
                                    placeholder="4111 1111 1111 1111" maxlength="19" required>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="expiracion">Fecha de Vencimiento</label>
                                    <input type="text" id="expiracion" name="expiracion" 
                                        placeholder="MM/AA" maxlength="5" required>
                                </div>

                                <div class="form-group">
                                    <label for="cvv">CVV</label>
                                    <input type="text" id="cvv" name="cvv" 
                                        placeholder="123" maxlength="4" required>
                                </div>
                            </div>

                            <div class="form-group col-full">
                                <label for="cedulaTitular">Cédula del Titular</label>
                                <input type="text" id="cedulaTitular" name="cedulaTitular" 
                                    placeholder="123456789" required>
                            </div>
                        </form>

                        <!-- Términos y Condiciones -->
                        <div class="form-group col-full">
                            <label>
                                <input type="checkbox" id="aceptarTerminos" required>
                                Acepto los términos y condiciones de TECAir
                            </label>
                        </div>

                        <div id="alertaError" class="alert alert-error"></div>
                        <div id="alertaExito" class="alert alert-success"></div>

                        <!-- Botones de Acción -->
                        <div class="pago-acciones">
                            <button type="button" class="btn btn-secondary" onclick="cancelarPago()">
                                Cancelar
                            </button>
                            <button type="button" class="btn btn-primary btn-lg" onclick="procesarPago()">
                                Procesar Pago
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 TECAir. Instituto Tecnológico de Costa Rica. Todos los derechos reservados.</p>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            cargarDetallesReservacion();
            formatearInputos();
        });

        function cargarDetallesReservacion() {
            const reservacion = JSON.parse(sessionStorage.getItem('reservacionTemporal') || '{}');
            const tarifa = reservacion.monto || 95;
            const impuestos = Math.round(tarifa * 0.13);
            const cargo = 5;
            const total = tarifa + impuestos + cargo;

            document.getElementById('detallesReservacion').innerHTML = `
                <p><strong>Pasajero:</strong> ${reservacion.pasajero || 'No especificado'}</p>
                <p><strong>Vuelo:</strong> ${reservacion.vuelo || 'TEC1234'}</p>
                <p><strong>Asiento:</strong> ${reservacion.asiento || '12A'}</p>
                <p><strong>Ruta:</strong> San José → Liberia</p>
            `;

            document.getElementById('tarifaBase').textContent = `$${tarifa}`;
            document.getElementById('impuestos').textContent = `$${impuestos}`;
            document.getElementById('cargo').textContent = `$${cargo}`;
            document.getElementById('montoTotal').textContent = `$${total}`;
        }

        function seleccionarMetodo(metodo) {
            document.querySelectorAll('.metodo-pago').forEach(m => m.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.querySelector(`input[value="${metodo}"]`).checked = true;
        }

        function formatearInputos() {
            // Formatear número de tarjeta
            document.getElementById('numeroTarjeta').addEventListener('input', function(e) {
                let valor = e.target.value.replace(/\s/g, '');
                let formateado = valor.match(/.{1,4}/g)?.join(' ') || valor;
                e.target.value = formateado;
            });

            // Formatear fecha de vencimiento
            document.getElementById('expiracion').addEventListener('input', function(e) {
                let valor = e.target.value.replace(/\D/g, '');
                if (valor.length >= 2) {
                    valor = valor.substring(0, 2) + '/' + valor.substring(2, 4);
                }
                e.target.value = valor;
            });

            // Solo números en CVV
            document.getElementById('cvv').addEventListener('input', function(e) {
                e.target.value = e.target.value.replace(/\D/g, '');
            });
        }

        /**
         * Procesa el pago — llama al API real con los datos de la reservación
         */
        async function procesarPago() {
            const aceptarTerminos = document.getElementById('aceptarTerminos').checked;

            if (!aceptarTerminos) {
                mostrarAlerta('Debes aceptar los términos y condiciones', 'error');
                return;
            }

            // Validar datos de tarjeta
            const numeroTarjeta = document.getElementById('numeroTarjeta').value.replace(/\s/g, '');
            if (numeroTarjeta.length < 13 || numeroTarjeta.length > 16) {
                mostrarAlerta('Número de tarjeta inválido', 'error');
                return;
            }

            // Procesar pago
            try {
                document.querySelector('.btn-lg').disabled = true;
                document.querySelector('.btn-lg').textContent = 'Procesando...';

                // Simular procesamiento
                setTimeout(() => {
                    mostrarAlerta('¡Pago procesado exitosamente! 🎉', 'exito');
                    
                    setTimeout(() => {
                        sessionStorage.removeItem('reservacionTemporal');
                        window.location.href = 'reservaciones.html';
                    }, 2000);
                }, 2000);
            } catch (error) {
                mostrarAlerta('Error al procesar el pago', 'error');
                document.querySelector('.btn-lg').disabled = false;
                document.querySelector('.btn-lg').textContent = 'Procesar Pago';
            }
        }

        function cancelarPago() {
            if (confirm('¿Deseas cancelar esta transacción?')) {
                sessionStorage.removeItem('reservacionTemporal');
                window.location.href = 'reservaciones.html';
            }
        }

        function mostrarAlerta(mensaje, tipo) {
            const alertaError = document.getElementById('alertaError');
            const alertaExito = document.getElementById('alertaExito');

            if (tipo === 'error') {
                alertaError.textContent = mensaje;
                alertaError.style.display = 'block';
                alertaExito.style.display = 'none';
            } else {
                alertaExito.textContent = mensaje;
                alertaExito.style.display = 'block';
                alertaError.style.display = 'none';
            }
        }
    </script>
</body>
</html>
