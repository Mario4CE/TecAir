<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    =====================================
    CONFIGURACIÓN DEL DOCUMENTO
    =====================================
    Define la codificación UTF-8, viewport responsivo y títulos de página
    Importa los estilos generales (styles.css) y específicos de login (login.css)
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <!--
    =====================================
    CONTENEDOR PRINCIPAL DE AUTENTICACIÓN
    =====================================
    Estructura general que envuelve toda la interfaz de login/registro
    -->
    <div class="auth-wrapper">
        <div class="auth-container">
            <!--
            ENCABEZADO CON BRANDING
            Muestra el logo y descripción de TECAir
            -->
            <div class="auth-header">
                <h1>✈️ TECAir</h1>
                <p>Tu aerolínea de bajo costo para estudiantes</p>
            </div>

            <!--
            CUERPO PRINCIPAL DE AUTENTICACIÓN
            Contiene alertas, indicador de carga y tabs para login/registro
            -->
            <div class="auth-body">
                <!--
                ALERTAS DE FEEDBACK
                Mostrar mensajes de error y éxito de las operaciones
                -->
                <div
                PESTAÑA 1: FORMULARIO DE LOGIN
                Permite iniciar sesión con solo nombre (sistema en fase de prueba)
                -->
                <div id="loginTab" class="tab-content active">
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="loginNombre">Nombre de Usuario</label>
                            <input 
                                type="text" 
                                id="loginNombre" 
                                name="nombre" 
                                placeholder="Tu nombre"
                                required
                            >
                        </div>

                        <button type="submit" class="btn-auth">Ingresar</button>
                    </form>
                    <p style="text-align: center; margin-top: 1rem; color: #7f8c8d; font-size: 12px;">
                        ℹ️ Sistema en fase de prueba - No se requiere contraseña
                    </p>
                </div>

                <!--
                PESTAÑA 2: FORMULARIO DE REGISTRO
                Recopila información completa del nuevo usuario (nombre, email, teléfono, estado estudiante)
               >
                <div id="loginTab" class="tab-content active">
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="loginNombre">Nombre de Usuario</label>
                            <input 
                                type="text" 
                                id="loginNombre" 
                                name="nombre" 
                                placeholder="Tu nombre"
                                required
                            >
                        </div>

                        <button type="submit" class="btn-auth">Ingresar</button>
                    </form>
                    <p style="text-align: center; margin-top: 1rem; color: #7f8c8d; font-size: 12px;">
                        ℹ️ Sistema en fase de prueba - No se requiere contraseña
                    </p>!--
                        DATOS BÁSICOS DEL USUARIO
                        Campos obligatorios: nombre completo, email y teléfono
                        -->
                        <div class="form-group">
                            <label for="regNombre">Nombre Completo</label>
                            <input 
                                type="text" 
                                id="regNombre" 
                                name="nombreCompleto" 
                                placeholder="Juan Pérez"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="regEmail">Correo Electrónico</label>
                            <input 
                                type="email" 
                                id="regEmail" 
                                name="email" 
                                placeholder="tu@email.com"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="regTelefono">Teléfono</label>
                            <input 
                                type="tel" 
                                id="regTelefono" 
                                name="telefono" 
                                placeholder="+506 2345 6789"
                                required
                            >
                        </div>

                        <!--
                        CHECKBOX PARA ESTADO ESTUDIANTE
                        Si se marca, muestra campos adicionales para datos estudiantiles
                        -->
                        <div class="form-group col-full">
                            <label>
                                <input type="checkbox" id="esEstudiante" name="esEstudiante">
                                Soy estudiante
                            </label>
                        </div>

                        <!--
                        DATOS ESTUDIANTILES OPCIONALES
                        Aparecen solo cuando se marca "Soy estudiante"
                        Solicita universidad y número de carnet
                        -->                        <div class="form-group col-full">
                            <label>
                                <input type="checkbox" id="esEstudiante" name="esEstudiante">
                                Soy estudiante
                            </label>
                        </div>

                        <div id="datosEstudiante" class="datos-estudiante" style="display: none;">
                            <div class="form-group">
                                <label for="universidad">Universidad</label>
                                <input 
                                    type="text" 
                                    id="universidad" 
                                    name="universidad" 
                                    placeholder="Ej: TEC"
                
            FOOTER CON INFORMACIÓN LEGAL
            Copyright y derechos reservados de TECAir
            -->
            <div class="auth-footer">
                <p>&copy; 2026 TECAir. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>

    <!--
    SCRIPTS EXTERNOS
    utils.js: Funciones utilitarias globales
    api.js: Funciones para llamadas a API
    auth.js: Funciones de autenticación
    -->
    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    
    <!--
    LÓGICA DE PÁGINA INLINE
    Gestiona:
    - Cambio de tabs (login/registro)
    - Validación de formularios
    - Guardado de usuario en localStorage
    - Redirección después de autenticación
    - Mostrar/ocultar alertas
    --laceholder="Número de carnet"
                                >
                            </div>
                        </div>

                        <button type="submit" class="btn-auth">Registrarse</button>
                    </form>
                </div>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <p>&copy; 2026 TECAir. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Cambiar tab para mostrar datos de estudiante
            document.getElementById('esEstudiante').addEventListener('change', function() {
                const datosEstudiante = document.getElementById('datosEstudiante');
                if (this.checked) {
                    datosEstudiante.style.display = 'block';
                } else {
                    datosEstudiante.style.display = 'none';
                }
            });

            // Manejar login
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const nombre = document.getElementById('loginNombre').value;
                
                if (!nombre.trim()) {
                    mostrarAlerta('Por favor ingresa tu nombre', 'error');
                    return;
                }

                // Guardar usuario en localStorage de forma simple
                const usuario = {
                    nombreCompleto: nombre,
                    email: `${nombre.toLowerCase().replace(' ', '.')}@tecair.cr`,
                    telefono: '',
                    esEstudiante: false,
                    universidad: '',
                    carnet: '',
                    millas: 0
                };
                
                guardarUsuarioActual(usuario);
                mostrarAlerta('¡Bienvenido a TECAir!', 'success');
                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 1000);
            });

            // Manejar registro
            document.getElementById('registroForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(document.getElementById('registroForm'));
                const datos = Object.fromEntries(formData);
                
                if (!datos.nombreCompleto.trim() || !datos.email.trim()) {
                    mostrarAlerta('Por favor completa los campos requeridos', 'error');
                    return;
                }

                // Guardar usuario en localStorage
                const usuario = {
                    nombreCompleto: datos.nombreCompleto,
                    email: datos.email,
                    telefono: datos.telefono || '',
                    esEstudiante: datos.esEstudiante === 'on',
                    universidad: datos.universidad || '',
                    carnet: datos.carnet || '',
                    millas: 0
                };
                
                guardarUsuarioActual(usuario);
                mostrarAlerta('¡Registro exitoso! Bienvenido a TECAir', 'success');
                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 1000);
            });
        });

        function cambiarTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('[onclick="cambiarTab(\'login\')"]').classList.add('active');
                document.getElementById('loginTab').classList.add('active');
            } else {
                document.querySelector('[onclick="cambiarTab(\'registro\')"]').classList.add('active');
                document.getElementById('registroTab').classList.add('active');
            }
        }

        function mostrarAlerta(mensaje, tipo) {
            const alertError = document.getElementById('alertError');
            const alertSuccess = document.getElementById('alertSuccess');
            
            if (tipo === 'error') {
                alertError.textContent = mensaje;
                alertError.classList.add('show');
                alertSuccess.classList.remove('show');
                setTimeout(() => alertError.classList.remove('show'), 5000);
            } else {
                alertSuccess.textContent = mensaje;
                alertSuccess.classList.add('show');
                alertError.classList.remove('show');
                setTimeout(() => alertSuccess.classList.remove('show'), 5000);
            }
        }
    </script>
</body>
</html>
