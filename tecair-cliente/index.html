<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    index.html — Página de inicio de sesión y registro de TECAir
    Conectado al API real en http://localhost:5000/api
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <!-- Encabezado con branding -->
            <div class="auth-header">
                <h1>✈️ TECAir</h1>
                <p>Tu aerolínea de bajo costo para estudiantes</p>
            </div>

            <div class="auth-body">
                <!-- Alertas de feedback -->
                <div id="alertError" class="alert alert-error"></div>
                <div id="alertSuccess" class="alert alert-success"></div>

                <!-- Indicador de carga -->
                <div id="loading" class="loading" style="display:none;">
                    <div class="spinner"></div>
                    <p>Procesando...</p>
                </div>

                <!-- Tabs de login y registro -->
                <div class="tabs">
                    <button class="tab-btn active" onclick="cambiarTab('login', event)">Iniciar Sesión</button>
                    <button class="tab-btn" onclick="cambiarTab('registro', event)">Registrarse</button>
                </div>

                <!-- PESTAÑA 1: LOGIN -->
                <div id="loginTab" class="tab-content active">
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="loginCorreo">Correo Electrónico</label>
                            <input type="email" id="loginCorreo" name="correo"
                                placeholder="tu@correo.com" required>
                        </div>
                        <button type="submit" class="btn-auth">Ingresar</button>
                    </form>
                </div>

                <!-- PESTAÑA 2: REGISTRO -->
                <div id="registroTab" class="tab-content">
                    <form id="registroForm" class="auth-form">
                        <div class="form-group">
                            <label for="regNombre1">Primer Nombre <span style="color:red">*</span></label>
                            <input type="text" id="regNombre1" name="nombre1"
                                placeholder="Juan" required>
                        </div>
                        <div class="form-group">
                            <label for="regNombre2">Segundo Nombre</label>
                            <input type="text" id="regNombre2" name="nombre2"
                                placeholder="Carlos">
                        </div>
                        <div class="form-group">
                            <label for="regApellido1">Primer Apellido <span style="color:red">*</span></label>
                            <input type="text" id="regApellido1" name="apellido1"
                                placeholder="Pérez" required>
                        </div>
                        <div class="form-group">
                            <label for="regApellido2">Segundo Apellido</label>
                            <input type="text" id="regApellido2" name="apellido2"
                                placeholder="Mora">
                        </div>
                        <div class="form-group">
                            <label for="regCorreo">Correo Electrónico <span style="color:red">*</span></label>
                            <input type="email" id="regCorreo" name="correo"
                                placeholder="tu@correo.com" required>
                        </div>
                        <div class="form-group">
                            <label for="regTelefono">Teléfono <span style="color:red">*</span></label>
                            <input type="tel" id="regTelefono" name="telefono"
                                placeholder="8888-8888" required>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="esEstudiante" name="esEstudiante">
                                Soy estudiante universitario
                            </label>
                        </div>
                        <div id="datosEstudiante" style="display:none;">
                            <div class="form-group">
                                <label for="universidad">Universidad <span style="color:red">*</span></label>
                                <input type="text" id="universidad" name="universidad"
                                    placeholder="ej. Instituto Tecnológico de Costa Rica">
                            </div>
                            <div class="form-group">
                                <label for="carnet">Carnet <span style="color:red">*</span></label>
                                <input type="text" id="carnet" name="carnet"
                                    placeholder="ej. 2024123456">
                            </div>
                        </div>
                        <button type="submit" class="btn-auth">Registrarse</button>
                    </form>
                </div>
            </div>

            <div class="auth-footer">
                <p>&copy; 2026 TECAir. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Si ya hay sesión activa, redirigir al menú
            if (estaAutenticado()) {
                window.location.href = 'menu.html';
                return;
            }

            // Mostrar/ocultar campos de estudiante
            document.getElementById('esEstudiante').addEventListener('change', function() {
                document.getElementById('datosEstudiante').style.display =
                    this.checked ? 'block' : 'none';
            });

            // Manejar login
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const correo = document.getElementById('loginCorreo').value.trim();
                if (!correo) {
                    mostrarAlerta('Por favor ingresa tu correo', 'error');
                    return;
                }
                document.getElementById('loading').style.display = 'flex';
                try {
                    await iniciarSesion(correo);
                    mostrarAlerta('¡Bienvenido a TECAir!', 'success');
                    setTimeout(() => window.location.href = 'menu.html', 1000);
                } catch (error) {
                    mostrarAlerta(error.message || 'Error al iniciar sesión', 'error');
                } finally {
                    document.getElementById('loading').style.display = 'none';
                }
            });

            // Manejar registro
            document.getElementById('registroForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const datos = {
                    nombre1:      document.getElementById('regNombre1').value.trim(),
                    nombre2:      document.getElementById('regNombre2').value.trim(),
                    apellido1:    document.getElementById('regApellido1').value.trim(),
                    apellido2:    document.getElementById('regApellido2').value.trim(),
                    correo:       document.getElementById('regCorreo').value.trim(),
                    telefono:     document.getElementById('regTelefono').value.trim(),
                    esEstudiante: document.getElementById('esEstudiante').checked,
                    universidad:  document.getElementById('universidad').value.trim(),
                    carnet:       document.getElementById('carnet').value.trim(),
                };
                if (!datos.nombre1 || !datos.apellido1 || !datos.correo || !datos.telefono) {
                    mostrarAlerta('Por favor completa los campos obligatorios', 'error');
                    return;
                }
                document.getElementById('loading').style.display = 'flex';
                try {
                    await registrarUsuario(datos);
                    mostrarAlerta('¡Registro exitoso! Bienvenido a TECAir', 'success');
                    setTimeout(() => window.location.href = 'menu.html', 1000);
                } catch (error) {
                    mostrarAlerta(error.message || 'Error al registrarse', 'error');
                } finally {
                    document.getElementById('loading').style.display = 'none';
                }
            });
        });

        // Cambia entre las pestañas de login y registro
        function cambiarTab(tab, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (event) event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
        }

        function mostrarAlerta(mensaje, tipo) {
            const alertError   = document.getElementById('alertError');
            const alertSuccess = document.getElementById('alertSuccess');
            if (tipo === 'error') {
                alertError.textContent = mensaje;
                alertError.classList.add('show');
                alertSuccess.classList.remove('show');
                setTimeout(() => alertError.classList.remove('show'), 5000);
            } else {
                alertSuccess.textContent = mensaje;
                alertSuccess.classList.add('show');
                alertError.classList.remove('show');
                setTimeout(() => alertSuccess.classList.remove('show'), 5000);
            }
        }
    </script>
</body>
</html>
