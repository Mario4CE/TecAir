<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    =====================================
    CONFIGURACIÓN DEL DOCUMENTO
    =====================================
    Página de inicio de sesión y registro de usuarios
    El registro crea el usuario en la API real
    Importa Bootstrap, íconos y estilos propios
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <!--
    =====================================
    CONTENEDOR PRINCIPAL DE AUTENTICACIÓN
    =====================================
    Estructura general que envuelve toda la interfaz de login/registro
    -->
    <div class="auth-wrapper">
        <div class="auth-container">

            <!--
            ENCABEZADO CON BRANDING
            Muestra el logo y descripción de TECAir
            -->
            <div class="auth-header">
                <h1>✈️ TECAir</h1>
                <p>Tu aerolínea de bajo costo para estudiantes</p>
            </div>

            <!--
            TABS DE NAVEGACIÓN
            Permite cambiar entre login y registro
            -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="cambiarTab('login')">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                </button>
                <button class="tab-btn" onclick="cambiarTab('registro')">
                    <i class="bi bi-person-plus me-1"></i>Registrarse
                </button>
            </div>

            <!--
            CUERPO PRINCIPAL DE AUTENTICACIÓN
            Contiene alertas y tabs para login/registro
            -->
            <div class="auth-body">

                <!--
                ALERTAS DE FEEDBACK
                Muestran mensajes de error y éxito de las operaciones
                -->
                <div id="alertError" class="alert alert-error"></div>
                <div id="alertSuccess" class="alert alert-success"></div>

                <!--
                PESTAÑA 1: FORMULARIO DE LOGIN
                Busca el usuario en la API por nombre
                Si no existe, redirige al registro
                -->
                <div id="loginTab" class="tab-content active">
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="loginNombre">
                                <i class="bi bi-person me-1"></i>Nombre de Usuario
                            </label>
                            <input
                                type="text"
                                id="loginNombre"
                                name="nombre"
                                placeholder="Tu nombre completo"
                                required
                            >
                        </div>
                        <button type="submit" class="btn-auth">
                            <i class="bi bi-airplane-fill me-2"></i>Ingresar
                        </button>
                    </form>
                    <p style="text-align: center; margin-top: 1rem; color: #7f8c8d; font-size: 12px;">
                        <i class="bi bi-info-circle me-1"></i>¿No tenés cuenta? Registrate arriba
                    </p>
                </div>

                <!--
                PESTAÑA 2: FORMULARIO DE REGISTRO
                Crea el usuario en la API mediante POST /api/usuarios
                Campos: nombre, email, teléfono y datos estudiantiles opcionales
                -->
                <div id="registroTab" class="tab-content">
                    <form id="registroForm" class="auth-form">

                        <!--
                        DATOS BÁSICOS DEL USUARIO
                        Campos obligatorios: nombre completo, email y teléfono
                        -->
                        <div class="form-group">
                            <label for="regNombre">
                                <i class="bi bi-person me-1"></i>Nombre Completo
                            </label>
                            <input
                                type="text"
                                id="regNombre"
                                name="nombreCompleto"
                                placeholder="Juan Pérez"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="regEmail">
                                <i class="bi bi-envelope me-1"></i>Correo Electrónico
                            </label>
                            <input
                                type="email"
                                id="regEmail"
                                name="email"
                                placeholder="tu@email.com"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="regTelefono">
                                <i class="bi bi-telephone me-1"></i>Teléfono
                            </label>
                            <input
                                type="tel"
                                id="regTelefono"
                                name="telefono"
                                placeholder="+506 8888 8888"
                                required
                            >
                        </div>

                        <!--
                        CHECKBOX PARA ESTADO ESTUDIANTE
                        Si se marca, muestra campos adicionales para datos estudiantiles
                        -->
                        <div class="form-group col-full">
                            <label>
                                <input type="checkbox" id="esEstudiante" name="esEstudiante">
                                <i class="bi bi-mortarboard me-1"></i>Soy estudiante universitario
                            </label>
                        </div>

                        <!--
                        DATOS ESTUDIANTILES OPCIONALES
                        Aparecen solo cuando se marca "Soy estudiante"
                        Solicita universidad y número de carnet para el programa de millas
                        -->
                        <div id="datosEstudiante" class="datos-estudiante" style="display: none;">
                            <div class="form-group">
                                <label for="universidad">Universidad</label>
                                <input
                                    type="text"
                                    id="universidad"
                                    name="universidad"
                                    placeholder="Ej: Instituto Tecnológico de Costa Rica"
                                >
                            </div>
                            <div class="form-group">
                                <label for="carnet">Número de Carnet</label>
                                <input
                                    type="text"
                                    id="carnet"
                                    name="carnet"
                                    placeholder="Ej: 2021123456"
                                >
                            </div>
                        </div>

                        <button type="submit" class="btn-auth">
                            <i class="bi bi-person-check-fill me-2"></i>Crear Cuenta
                        </button>
                    </form>
                </div>

            </div>

            <!--
            FOOTER CON INFORMACIÓN LEGAL
            Copyright y derechos reservados de TECAir
            -->
            <div class="auth-footer">
                <p>&copy; 2026 TECAir. Todos los derechos reservados.</p>
            </div>

        </div>
    </div>

    <!--
    SCRIPTS EXTERNOS
    utils.js: Funciones utilitarias globales
    api.js: Funciones para llamadas a API
    auth.js: Funciones de autenticación
    -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <!--
    LÓGICA DE PÁGINA INLINE
    Gestiona:
    - Cambio de tabs (login/registro)
    - Validación de formularios
    - Registro de usuario en la API real
    - Guardado de usuario en localStorage
    - Redirección después de autenticación
    - Mostrar/ocultar alertas y datos de estudiante
    -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // Mostrar/ocultar datos de estudiante según checkbox
            document.getElementById('esEstudiante').addEventListener('change', function() {
                const datosEstudiante = document.getElementById('datosEstudiante');
                if (this.checked) {
                    datosEstudiante.style.display = 'block';
                } else {
                    datosEstudiante.style.display = 'none';
                }
            });

            // Manejar login
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const nombre = document.getElementById('loginNombre').value.trim();

                if (!nombre) {
                    mostrarAlerta('Por favor ingresá tu nombre', 'error');
                    return;
                }

                try {
                    // Buscar el usuario en la API por nombre
                    const respuesta = await apiGet('usuarios');
                    const usuarios = respuesta.usuarios || [];
                    const nombreLower = nombre.toLowerCase();

                    // Buscar coincidencia por nombre
                    const usuarioEncontrado = usuarios.find(u => {
                        const nombreCompleto = [u.nombre1, u.nombre2, u.apellido1, u.apellido2]
                            .filter(Boolean).join(' ').toLowerCase();
                        return nombreCompleto.includes(nombreLower);
                    });

                    if (usuarioEncontrado) {
                        // Usuario encontrado en la API
                        const usuario = {
                            idUsuario: usuarioEncontrado.id_usuario,
                            nombreCompleto: [usuarioEncontrado.nombre1, usuarioEncontrado.nombre2,
                                             usuarioEncontrado.apellido1, usuarioEncontrado.apellido2]
                                            .filter(Boolean).join(' '),
                            email: usuarioEncontrado.correo,
                            telefono: usuarioEncontrado.telefono,
                            esEstudiante: usuarioEncontrado.es_estudiante,
                            universidad: usuarioEncontrado.universidad,
                            carnet: usuarioEncontrado.carnet,
                            millas: usuarioEncontrado.millas
                        };

                        guardarUsuarioActual(usuario);
                        mostrarAlerta('¡Bienvenido a TECAir!', 'success');
                        setTimeout(() => { window.location.href = 'menu.html'; }, 1000);
                    } else {
                        mostrarAlerta('Usuario no encontrado. ¿Ya te registraste?', 'error');
                    }
                } catch (error) {
                    console.error('Error en login:', error);
                    // Si falla la API, login simple con localStorage
                    const usuario = {
                        nombreCompleto: nombre,
                        email: nombre.toLowerCase().replace(/\s+/g, '.') + '@tecair.cr',
                        telefono: '',
                        esEstudiante: false,
                        universidad: '',
                        carnet: '',
                        millas: 0
                    };
                    guardarUsuarioActual(usuario);
                    mostrarAlerta('¡Bienvenido a TECAir!', 'success');
                    setTimeout(() => { window.location.href = 'menu.html'; }, 1000);
                }
            });

            // Manejar registro
            document.getElementById('registroForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const nombre   = document.getElementById('regNombre').value.trim();
                const email    = document.getElementById('regEmail').value.trim();
                const telefono = document.getElementById('regTelefono').value.trim();
                const esEst    = document.getElementById('esEstudiante').checked;

                if (!nombre || !email || !telefono) {
                    mostrarAlerta('Por favor completá todos los campos requeridos', 'error');
                    return;
                }

                if (esEst) {
                    const univ   = document.getElementById('universidad').value.trim();
                    const carnet = document.getElementById('carnet').value.trim();
                    if (!univ || !carnet) {
                        mostrarAlerta('Completá los datos de estudiante', 'error');
                        return;
                    }
                }

                try {
                    // Registrar usuario en la API real mediante POST /api/usuarios
                    const respuesta = await registrarUsuario({
                        nombreCompleto: nombre,
                        email: email,
                        telefono: telefono,
                        esEstudiante: esEst,
                        universidad: esEst ? document.getElementById('universidad').value.trim() : '',
                        carnet: esEst ? document.getElementById('carnet').value.trim() : '',
                        millas: 0
                    });

                    const usuarioCreado = respuesta.usuario || respuesta.usuarios?.[0] || respuesta;
                    console.log('Usuario creado:', usuarioCreado);
                    console.log('Keys del usuario:', Object.keys(usuarioCreado));

                    // Guardar en localStorage con el ID de la API para las demás páginas
                    const usuario = {
                        idUsuario: usuarioCreado.id_usuario || usuarioCreado.idUsuario || usuarioCreado.id,
                        nombreCompleto: nombre,
                        email: email,
                        telefono: telefono,
                        esEstudiante: esEst,
                        universidad: esEst ? document.getElementById('universidad').value.trim() : '',
                        carnet: esEst ? document.getElementById('carnet').value.trim() : '',
                        millas: 0
                    };

                    guardarUsuarioActual(usuario);
                    mostrarAlerta('¡Registro exitoso! Bienvenido a TECAir', 'success');
                    setTimeout(() => { window.location.href = 'menu.html'; }, 1200);

                } catch (error) {
                    console.error('Error en registro:', error);
                    mostrarAlerta('Error al crear la cuenta. Intentá de nuevo.', 'error');
                }
            });
        });

        /**
         * Cambia la pestaña activa entre login y registro
         * @param {string} tab - Tab a mostrar ('login' o 'registro')
         */
        function cambiarTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registroTab').classList.add('active');
            }
        }

        /**
         * Muestra una alerta de error o éxito
         * @param {string} mensaje - Texto a mostrar
         * @param {string} tipo - Tipo de alerta ('error' o 'success')
         */
        function mostrarAlerta(mensaje, tipo) {
            const alertError   = document.getElementById('alertError');
            const alertSuccess = document.getElementById('alertSuccess');

            alertError.classList.remove('show');
            alertSuccess.classList.remove('show');

            if (tipo === 'error') {
                alertError.textContent = mensaje;
                
                alertError.classList.add('show');
                setTimeout(() => alertError.classList.remove('show'), 5000);
            } else {
                alertSuccess.textContent = mensaje;
                alertSuccess.classList.add('show');
                setTimeout(() => alertSuccess.classList.remove('show'), 5000);
            }
        }
    </script>
</body>
</html>
