<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    =====================================
    CONFIGURACIÓN DEL DOCUMENTO
    =====================================
    Página para gestionar reservaciones de vuelos
    Las reservaciones se cargan desde la API real
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Mis Reservaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .tab-btn-custom { padding: 0.6rem 1.2rem; border: none; background: none; font-family: 'Nunito', sans-serif; font-weight: 600; color: #6c757d; border-bottom: 3px solid transparent; cursor: pointer; transition: all 0.25s; }
        .tab-btn-custom:hover { color: #0066cc; }
        .tab-btn-custom.active { color: #0066cc; border-bottom-color: #0066cc; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .reservacion-card { border-left: 4px solid #0066cc; border-radius: 0 8px 8px 0; }
    </style>
</head>
<body>
    <!--
    =====================================
    BARRA DE NAVEGACIÓN
    =====================================
    -->
    <nav class="navbar navbar-expand-lg" style="background: linear-gradient(135deg, #0066cc, #004a99);">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white fw-bold fs-4" href="menu.html">✈️ TECAir</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="bi bi-list text-white fs-4"></i>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item"><a class="nav-link text-white" href="menu.html"><i class="bi bi-house me-1"></i>Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="vuelos.html"><i class="bi bi-search me-1"></i>Buscar Vuelos</a></li>
                    <li class="nav-item"><a class="nav-link text-white active fw-semibold" href="reservaciones.html"><i class="bi bi-journal-check me-1"></i>Mis Reservaciones</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="promociones.html"><i class="bi bi-tag me-1"></i>Promociones</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="perfil.html"><i class="bi bi-person me-1"></i>Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" onclick="salir(); return false;"><i class="bi bi-box-arrow-right me-1"></i>Salir</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!--
    =====================================
    CONTENIDO PRINCIPAL: RESERVACIONES
    =====================================
    Tres tabs: Activas, Historial y Nueva Reservación
    -->
    <div class="container my-4">
        <h1 class="text-primary fw-bold mb-4"><i class="bi bi-journal-check me-2"></i>Mis Reservaciones</h1>

        <!--
        NAVEGACIÓN POR TABS
        -->
        <div class="border-bottom mb-4">
            <button class="tab-btn-custom active" onclick="cambiarTabReservaciones('activas')">
                <i class="bi bi-clock me-1"></i>Reservaciones Activas
            </button>
            <button class="tab-btn-custom" onclick="cambiarTabReservaciones('historial')">
                <i class="bi bi-archive me-1"></i>Historial
            </button>
            <button class="tab-btn-custom" onclick="cambiarTabReservaciones('nueva')">
                <i class="bi bi-plus-circle me-1"></i>Nueva Reservación
            </button>
        </div>

        <!--
        TAB 1: RESERVACIONES ACTIVAS
        Se cargan desde GET /api/reservaciones?idUsuario=X
        -->
        <div id="activasTab" class="tab-panel active">
            <div id="loadingActivas" class="text-center py-4">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Cargando reservaciones...</p>
            </div>
            <div id="listadoActivas" class="row g-3"></div>
        </div>

        <!--
        TAB 2: HISTORIAL
        Muestra reservaciones canceladas o completadas
        -->
        <div id="historialTab" class="tab-panel">
            <div id="loadingHistorial" class="text-center py-4">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Cargando historial...</p>
            </div>
            <div id="listadoHistorial" class="row g-3"></div>
        </div>

        <!--
        TAB 3: NUEVA RESERVACIÓN
        Formulario para crear una nueva reservación
        El select de vuelos se carga desde la API
        -->
        <div id="nuevaTab" class="tab-panel">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="fw-bold text-primary mb-4"><i class="bi bi-plus-circle me-2"></i>Crear Nueva Reservación</h5>
                    <form id="formReservacion">
                        <div class="row g-3">
                            <!--
                            DATOS DEL PASAJERO
                            Se pre-llenan con los datos del usuario actual
                            -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold" for="pasajeroNombre"><i class="bi bi-person me-1"></i>Nombre del Pasajero</label>
                                <input type="text" class="form-control" id="pasajeroNombre" name="pasajeroNombre" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold" for="pasajeroEmail"><i class="bi bi-envelope me-1"></i>Correo Electrónico</label>
                                <input type="email" class="form-control" id="pasajeroEmail" name="pasajeroEmail" required>
                            </div>

                            <!--
                            SELECCIÓN DE VUELO
                            Se carga desde GET /api/vuelos
                            -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold" for="vueloSeleccionado"><i class="bi bi-airplane me-1"></i>Seleccionar Vuelo</label>
                                <select class="form-select" id="vueloSeleccionado" name="vueloSeleccionado" required>
                                    <option value="">Cargando vuelos...</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold" for="asiento"><i class="bi bi-person-seat me-1"></i>Seleccionar Asiento</label>
                                <input type="text" class="form-control" id="asiento" name="asiento" placeholder="Ej: 12A" required>
                            </div>

                            <!--
                            DATOS DE PASAPORTE OPCIONAL
                            -->
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="requerirPasaporte" name="requerirPasaporte">
                                    <label class="form-check-label fw-semibold" for="requerirPasaporte">
                                        <i class="bi bi-passport me-1"></i>Incluir información de pasaporte
                                    </label>
                                </div>
                            </div>
                            <div id="datoPasaporte" class="col-12 d-none">
                                <label class="form-label fw-semibold" for="numeroPasaporte">Número de Pasaporte</label>
                                <input type="text" class="form-control" id="numeroPasaporte" name="numeroPasaporte">
                            </div>

                            <!--
                            BOTÓN DE ACCIÓN
                            -->
                            <div class="col-12">
                                <button type="button" class="btn btn-primary px-4 py-2 fw-bold" onclick="procederPago()">
                                    <i class="bi bi-credit-card me-2"></i>Proceder al Pago
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5">
        <p>&copy; 2026 TECAir. Instituto Tecnológico de Costa Rica. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        /*
        =====================================
        INICIALIZACIÓN
        =====================================
        Carga reservaciones y vuelos desde la API al abrir la página
        */
        document.addEventListener('DOMContentLoaded', async function() {
            // protegerRuta(); // Desactivado para fase de prueba

            // Pre-llenar datos del usuario
            const usuario = obtenerUsuarioActual();
            if (usuario) {
                document.getElementById('pasajeroNombre').value = usuario.nombreCompleto || '';
                document.getElementById('pasajeroEmail').value = usuario.email || '';
            }

            // Mostrar/ocultar datos de pasaporte
            document.getElementById('requerirPasaporte').addEventListener('change', function() {
                document.getElementById('datoPasaporte').classList.toggle('d-none', !this.checked);
            });

            // Cargar datos desde la API
            await cargarReservaciones();
            await cargarVuelosDisponibles();
        });

        /**
         * Carga las reservaciones del usuario desde la API
         * Separa las activas de las del historial según el estado
         */
        async function cargarReservaciones() {
            try {
                const usuario = obtenerUsuarioActual();
                const idUsuario = usuario?.idUsuario || 1;

                const respuesta = await obtenerReservaciones(idUsuario);
                const reservaciones = respuesta.reservaciones || [];

                // Separar activas e historial según estado
                const activas = reservaciones.filter(r =>
                    r.estado === 'pendiente_pago' || r.estado === 'pagada'
                );
                const historial = reservaciones.filter(r =>
                    r.estado === 'cancelada'
                );

                mostrarReservaciones(activas, 'listadoActivas', 'loadingActivas', true);
                mostrarReservaciones(historial, 'listadoHistorial', 'loadingHistorial', false);

            } catch (error) {
                console.error('Error cargando reservaciones:', error);
                document.getElementById('loadingActivas').innerHTML =
                    '<p class="text-danger text-center">Error al cargar reservaciones. Verificá que la API esté corriendo.</p>';
                document.getElementById('loadingHistorial').innerHTML = '';
            }
        }

        /**
         * Muestra una lista de reservaciones en el contenedor indicado
         * @param {Array} lista - Lista de reservaciones
         * @param {string} contenedorId - ID del div donde mostrar
         * @param {string} loadingId - ID del spinner a ocultar
         * @param {boolean} mostrarAcciones - Si mostrar botones de acción
         */
        function mostrarReservaciones(lista, contenedorId, loadingId, mostrarAcciones) {
            document.getElementById(loadingId).style.display = 'none';
            const contenedor = document.getElementById(contenedorId);

            if (lista.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-5 text-muted">
                        <i class="bi bi-calendar-x fs-1 d-block mb-2"></i>
                        No hay reservaciones para mostrar
                        ${mostrarAcciones ? '<div class="mt-3"><button class="btn btn-primary" onclick="cambiarTabReservaciones(\'nueva\')"><i class="bi bi-plus me-1"></i>Hacer nueva reservación</button></div>' : ''}
                    </div>`;
                return;
            }

            let html = '';
            lista.forEach(res => {
                const estadoClass = res.estado === 'pagada' ? 'success' :
                                    res.estado === 'pendiente_pago' ? 'warning' : 'danger';
                const estadoTexto = res.estado === 'pagada' ? 'Pagada' :
                                    res.estado === 'pendiente_pago' ? 'Pendiente' : 'Cancelada';
                const origen = res.vuelo?.origen || '--';
                const destino = res.vuelo?.destino || '--';
                const fecha = res.fechaReservacion ? new Date(res.fechaReservacion).toLocaleDateString('es-CR') : '--';

                html += `
                <div class="col-md-6">
                    <div class="card shadow-sm reservacion-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="fw-bold mb-0">Reservación #${res.idReservacion}</h6>
                                <span class="badge bg-${estadoClass}">${estadoTexto}</span>
                            </div>
                            <p class="small mb-1"><strong>Ruta:</strong> ${origen} → ${destino}</p>
                            <p class="small mb-1"><strong>Fecha:</strong> ${fecha}</p>
                            <p class="small mb-3"><strong>Vuelo ID:</strong> ${res.idVuelo}</p>
                            ${mostrarAcciones ? `
                            <div class="d-flex gap-2">
                                <button class="btn btn-danger btn-sm" onclick="cancelarReservacionAPI(${res.idReservacion})">
                                    <i class="bi bi-x me-1"></i>Cancelar
                                </button>
                            </div>` : ''}
                        </div>
                    </div>
                </div>`;
            });

            contenedor.innerHTML = html;
        }

        /**
         * Carga los vuelos disponibles desde la API
         * y los agrega al select del formulario de nueva reservación
         */
        async function cargarVuelosDisponibles() {
            try {
                const respuesta = await obtenerVuelos({});
                const vuelos = respuesta.vuelos || [];
                const select = document.getElementById('vueloSeleccionado');

                select.innerHTML = '<option value="">-- Selecciona un vuelo --</option>';
                vuelos.forEach(vuelo => {
                    select.innerHTML += `<option value="${vuelo.idVuelo}">
                        Vuelo #${vuelo.idVuelo} - ${vuelo.origen} → ${vuelo.destino} ($${vuelo.precio})
                    </option>`;
                });
            } catch (error) {
                console.error('Error cargando vuelos:', error);
                document.getElementById('vueloSeleccionado').innerHTML =
                    '<option value="">Error al cargar vuelos</option>';
            }
        }

        /**
         * Cancela una reservación llamando a la API
         * @param {number} idReservacion - ID de la reservación a cancelar
         */
        async function cancelarReservacionAPI(idReservacion) {
            if (!confirm('¿Estás seguro que deseas cancelar esta reservación?')) return;

            try {
                await cancelarReservacion(idReservacion);
                alert('Reservación cancelada exitosamente');
                await cargarReservaciones();
            } catch (error) {
                console.error('Error cancelando reservación:', error);
                alert('Error al cancelar la reservación');
            }
        }

        /**
         * Guarda los datos del formulario y redirige a la página de pago
         */
        function procederPago() {
            const pasajero = document.getElementById('pasajeroNombre').value;
            const idVuelo = document.getElementById('vueloSeleccionado').value;
            const asiento = document.getElementById('asiento').value;

            if (!pasajero || !idVuelo || !asiento) {
                alert('Por favor completa todos los campos requeridos');
                return;
            }

            // Obtener el texto del vuelo seleccionado
            const selectVuelo = document.getElementById('vueloSeleccionado');
            const textoVuelo = selectVuelo.options[selectVuelo.selectedIndex].text;

            // Guardar datos para la página de pago
            sessionStorage.setItem('reservacionTemporal', JSON.stringify({
                pasajero,
                idVuelo,
                textoVuelo,
                asiento,
                usuario: obtenerUsuarioActual()
            }));

            window.location.href = 'pago.html';
        }

        /**
         * Cambia entre los tabs de reservaciones
         * @param {string} tab - Tab a mostrar ('activas', 'historial' o 'nueva')
         */
        function cambiarTabReservaciones(tab) {
            document.querySelectorAll('.tab-btn-custom').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

            document.querySelectorAll('.tab-btn-custom')[['activas', 'historial', 'nueva'].indexOf(tab)].classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
        }
    </script>
</body>
</html>
