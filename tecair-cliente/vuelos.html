<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    =====================================
    CONFIGURACIÓN DEL DOCUMENTO
    =====================================
    Página para buscar vuelos disponibles
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Buscar Vuelos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .vuelo-card { border: 1px solid #e9ecef; border-radius: 10px; padding: 1.25rem; background: white; transition: all 0.3s; }
        .vuelo-card:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        .hora { font-size: 1.3rem; font-weight: 800; color: #0066cc; }
        .codigo { font-size: 1rem; font-weight: 700; }
        .linea-ruta { color: #bdc3c7; font-size: 1.2rem; }
        .escala-badge { background: #3498db; color: white; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 20px; }
    </style>
</head>
<body>
    <!--
    =====================================
    BARRA DE NAVEGACIÓN
    =====================================
    -->
    <nav class="navbar navbar-expand-lg" style="background: linear-gradient(135deg, #0066cc, #004a99);">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-white fw-bold fs-4" href="menu.html">✈️ TECAir</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="bi bi-list text-white fs-4"></i>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item"><a class="nav-link text-white" href="menu.html"><i class="bi bi-house me-1"></i>Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white active fw-semibold" href="vuelos.html"><i class="bi bi-search me-1"></i>Buscar Vuelos</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="reservaciones.html"><i class="bi bi-journal-check me-1"></i>Mis Reservaciones</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="promociones.html"><i class="bi bi-tag me-1"></i>Promociones</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="perfil.html"><i class="bi bi-person me-1"></i>Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" onclick="salir(); return false;"><i class="bi bi-box-arrow-right me-1"></i>Salir</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!--
    =====================================
    CONTENIDO PRINCIPAL
    =====================================
    -->
    <div class="container my-4">
        <h1 class="text-primary fw-bold mb-4"><i class="bi bi-search me-2"></i>Buscar Vuelos</h1>

        <!--
        FORMULARIO DE BÚSQUEDA
        -->
        <div class="card shadow-sm mb-4" style="background: linear-gradient(135deg, #f5f7fa, #ecf0f1);">
            <div class="card-body">
                <form id="busquedaForm">
                    <!--
                    PRIMERA FILA: Origen, Destino y Fecha Salida
                    -->
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="origen"><i class="bi bi-geo-alt me-1"></i>Aeropuerto de Origen</label>
                            <select class="form-select" id="origen" name="origen" required>
                                <option value="">-- Selecciona origen --</option>
                                <option value="SJO">San José (SJO)</option>
                                <option value="LIR">Liberia (LIR)</option>
                                <option value="LIM">Limón (LIM)</option>
                                <option value="QST">Quepos (QST)</option>
                                <option value="PJM">Palmar (PJM)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="destino"><i class="bi bi-geo-alt-fill me-1"></i>Aeropuerto de Destino</label>
                            <select class="form-select" id="destino" name="destino" required>
                                <option value="">-- Selecciona destino --</option>
                                <option value="SJO">San José (SJO)</option>
                                <option value="LIR">Liberia (LIR)</option>
                                <option value="LIM">Limón (LIM)</option>
                                <option value="QST">Quepos (QST)</option>
                                <option value="PJM">Palmar (PJM)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="fechaSalida"><i class="bi bi-calendar me-1"></i>Fecha de Salida</label>
                            <input type="date" class="form-control" id="fechaSalida" name="fechaSalida" required>
                        </div>

                        <!--
                        SEGUNDA FILA: Fecha Regreso, Pasajeros y Botón Buscar
                        -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="fechaRegreso"><i class="bi bi-calendar-check me-1"></i>Fecha de Regreso <span class="text-muted">(opcional)</span></label>
                            <input type="date" class="form-control" id="fechaRegreso" name="fechaRegreso">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="pasajeros"><i class="bi bi-people me-1"></i>Pasajeros</label>
                            <select class="form-select" id="pasajeros" name="pasajeros" required>
                                <option value="1">1 Pasajero</option>
                                <option value="2">2 Pasajeros</option>
                                <option value="3">3 Pasajeros</option>
                                <option value="4">4 Pasajeros</option>
                                <option value="5">5 Pasajeros</option>
                                <option value="6">6 Pasajeros</option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                                <i class="bi bi-search me-2"></i>Buscar Vuelos
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!--
        ALERTAS DE FEEDBACK
        -->
        <div id="alertError" class="alert alert-danger d-none"><i class="bi bi-exclamation-circle me-2"></i><span></span></div>
        <div id="alertSuccess" class="alert alert-success d-none"><i class="bi bi-check-circle me-2"></i><span></span></div>

        <!--
        INDICADOR DE CARGA
        -->
        <div id="loading" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Buscando vuelos...</p>
        </div>

        <!-- Resultados de Búsqueda -->
        <div id="resultados" class="d-none">
            <h4 class="fw-bold mb-3">Vuelos Disponibles</h4>
            <div id="listaVuelos" class="row g-3">
                <!-- Los vuelos se cargarán aquí -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5">
        <p>&copy; 2026 TECAir. Instituto Tecnológico de Costa Rica. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // protegerRuta(); // Desactivado para fase de prueba

            // Establecer fecha mínima en hoy
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fechaSalida').min = hoy;
            document.getElementById('fechaRegreso').min = hoy;

            // Manejar cambios en fecha de salida
            document.getElementById('fechaSalida').addEventListener('change', function() {
                document.getElementById('fechaRegreso').min = this.value;
            });

            // Manejar búsqueda
            document.getElementById('busquedaForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await buscarVuelos();
            });
        });

        async function buscarVuelos() {
            const origen = document.getElementById('origen').value;
            const destino = document.getElementById('destino').value;

            if (!origen || !destino) {
                mostrarAlerta('Por favor selecciona origen y destino', 'error');
                return;
            }

            if (origen === destino) {
                mostrarAlerta('El origen y destino no pueden ser iguales', 'error');
                return;
            }

            try {
                document.getElementById('loading').classList.remove('d-none');
                document.getElementById('resultados').classList.add('d-none');

                // Simular búsqueda de vuelos
                const vuelos = generarVuelosSimulados(origen, destino);

                if (vuelos.length === 0) {
                    mostrarAlerta('No se encontraron vuelos para esa ruta', 'error');
                } else {
                    mostrarResultados(vuelos);
                    document.getElementById('resultados').classList.remove('d-none');
                }
            } catch (error) {
                mostrarAlerta('Error al buscar vuelos', 'error');
            } finally {
                document.getElementById('loading').classList.add('d-none');
            }
        }

        function generarVuelosSimulados(origen, destino) {
            const aeropuertos = {
                'SJO': 'San José', 'LIR': 'Liberia',
                'LIM': 'Limón', 'QST': 'Quepos', 'PJM': 'Palmar'
            };

            const vuelos = [];
            for (let i = 0; i < 4; i++) {
                const hora = String(8 + i * 2).padStart(2, '0');
                vuelos.push({
                    id: i + 1,
                    numero: `TEC${Math.floor(Math.random() * 9000) + 1000}`,
                    origen, destino,
                    originNombre: aeropuertos[origen],
                    destinoNombre: aeropuertos[destino],
                    salida: `${hora}:00`,
                    llegada: `${String(parseInt(hora) + 2).padStart(2, '0')}:15`,
                    duracion: '2h 15m',
                    precio: Math.floor(Math.random() * 150) + 45,
                    asientosDisponibles: Math.floor(Math.random() * 50) + 10,
                    escala: i % 2 === 0 ? 'Directo' : '1 escala'
                });
            }
            return vuelos;
        }

        function mostrarResultados(vuelos) {
            const listaVuelos = document.getElementById('listaVuelos');
            let html = '';

            vuelos.forEach(vuelo => {
                html += `
                <div class="col-md-6">
                    <div class="vuelo-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="fw-bold mb-0">${vuelo.numero}</h6>
                            <span class="escala-badge">${vuelo.escala}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center p-3 rounded mb-3" style="background:#f8f9fa;">
                            <div class="text-center">
                                <div class="hora">${vuelo.salida}</div>
                                <div class="codigo">${vuelo.origen}</div>
                                <small class="text-muted">${vuelo.originNombre}</small>
                            </div>
                            <div class="text-center linea-ruta">
                                <div>✈️</div>
                                <small class="text-muted">${vuelo.duracion}</small>
                            </div>
                            <div class="text-center">
                                <div class="hora">${vuelo.llegada}</div>
                                <div class="codigo">${vuelo.destino}</div>
                                <small class="text-muted">${vuelo.destinoNombre}</small>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="small text-muted">
                                <i class="bi bi-person-seat me-1"></i>${vuelo.asientosDisponibles} asientos
                                &nbsp;|&nbsp;
                                <strong class="text-success">$${vuelo.precio}</strong> p/p
                            </div>
                            <button class="btn btn-success btn-sm px-3" onclick="seleccionarVuelo(${vuelo.id})">
                                <i class="bi bi-check-lg me-1"></i>Seleccionar
                            </button>
                        </div>
                    </div>
                </div>`;
            });

            listaVuelos.innerHTML = html;
        }

        function seleccionarVuelo(vueloId) {
            sessionStorage.setItem('vueloSeleccionado', vueloId);
            mostrarAlerta('Vuelo seleccionado. Redirigiendo...', 'success');
            setTimeout(() => { window.location.href = 'reservaciones.html'; }, 1500);
        }

        function mostrarAlerta(mensaje, tipo) {
            const alertError = document.getElementById('alertError');
            const alertSuccess = document.getElementById('alertSuccess');

            alertError.classList.add('d-none');
            alertSuccess.classList.add('d-none');

            if (tipo === 'error') {
                alertError.querySelector('span').textContent = mensaje;
                alertError.classList.remove('d-none');
            } else {
                alertSuccess.querySelector('span').textContent = mensaje;
                alertSuccess.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
