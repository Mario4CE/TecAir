<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    promociones.html — Muestra las promociones activas del API
    Conectado al API real — trae promociones desde /api/promociones
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Promociones</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand"><h2>✈️ TECAir</h2></div>
            <ul class="navbar-menu">
                <li><a href="menu.html">Inicio</a></li>
                <li><a href="vuelos.html">Buscar Vuelos</a></li>
                <li><a href="reservaciones.html">Mis Reservaciones</a></li>
                <li><a href="promociones.html" class="active">Promociones</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="#" onclick="salir(); return false;">Cerrar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="promociones-section">
            <h1>Promociones Especiales</h1>
            <p class="subtitle">Descubre las mejores ofertas y viaja al mejor precio</p>

            <!-- Filtros -->
            <div class="filtros-section">
                <button class="filter-btn active" onclick="filtrar('todas')">Todas</button>
                <button class="filter-btn" onclick="filtrar('vigentes')">Vigentes</button>
            </div>

            <!-- Spinner -->
            <div id="loading" class="loading" style="display:flex;">
                <div class="spinner"></div>
                <p>Cargando promociones...</p>
            </div>

            <!-- Grid de promociones — se llena desde el API -->
            <div id="promocionesGrid" class="promociones-grid"></div>
        </div>
    </div>

    <!-- Modal de detalle -->
    <div id="modalPromocion" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <div id="detallePromocion"></div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 TECAir. Instituto Tecnológico de Costa Rica. Todos los derechos reservados.</p>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Guarda las promociones del API para filtrar sin volver a llamar
        let todasLasPromociones = [];

        document.addEventListener('DOMContentLoaded', async function() {
            if (!estaAutenticado()) {
                window.location.href = 'index.html';
                return;
            }
            await cargarPromociones();
        });

        /**
         * Carga las promociones desde el API y las renderiza
         */
       async function cargarPromociones() {
            try {
                // Trae promociones y rutas en paralelo
                const [dataPromociones, dataRutas] = await Promise.all([
                    obtenerPromociones(),
                    apiGet('rutas')
                ]);

                todasLasPromociones = dataPromociones.promociones ?? [];
                const rutas = dataRutas.rutas ?? [];

                // Agrega la descripción de la ruta a cada promoción
                todasLasPromociones = todasLasPromociones.map(promo => {
                    const ruta = rutas.find(r => r.id_ruta === promo.id_ruta);
                    // Extrae origen y destino de las escalas
                    const origen  = ruta?.escalas?.find(e => e.tipo === "origen")?.nombre  ?? `Ruta #${promo.id_ruta}`;
                    const destino = ruta?.escalas?.find(e => e.tipo === "destino")?.nombre ?? "";
                    return {
                        ...promo,
                        descripcionRuta: destino ? `${origen} → ${destino}` : origen,
                    };
                });

                mostrarPromociones(todasLasPromociones);
            } catch (error) {
                document.getElementById('promocionesGrid').innerHTML =
                    '<div class="empty-state"><p>Error al cargar promociones</p></div>';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        /**
         * Renderiza las tarjetas de promociones
         */
        function mostrarPromociones(lista) {
            const grid = document.getElementById('promocionesGrid');
            if (lista.length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>No hay promociones disponibles</p></div>';
                return;
            }

            let html = '';
            lista.forEach(promo => {
                // Determina si la promoción está vigente
                const hoy    = new Date();
                const inicio = promo.fecha_inicio ? new Date(promo.fecha_inicio) : null;
                const fin    = promo.fecha_fin    ? new Date(promo.fecha_fin)    : null;
                const vigente = (!inicio || hoy >= inicio) && (!fin || hoy <= fin);

                html += `
                    <div class="promo-card" onclick="abrirModal(${promo.id_promocion})">
                        <div class="promo-imagen">✈️</div>
                        <div class="promo-cuerpo">
                            <h3>Ruta #${promo.descripcionRuta}</h3>
                            <div class="promo-precios">
                                <span class="precio-promo">$${promo.precio}</span>
                            </div>
                            <div class="promo-badge">
                                <span class="${vigente ? 'descuento-badge' : ''}"
                                    style="background:${vigente ? '' : '#e2e3e5'};
                                           color:${vigente ? '' : '#495057'}">
                                    ${vigente ? 'Vigente' : 'Vencida'}
                                </span>
                            </div>
                            ${promo.fecha_inicio
                                ? `<p class="promo-validez">
                                    <small>Válido: ${promo.fecha_inicio} — ${promo.fecha_fin ?? '?'}</small>
                                   </p>`
                                : ''}
                        </div>
                        <button class="btn btn-sm btn-success btn-block">Ver Más</button>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        /**
         * Filtra las promociones por estado
         */
        function filtrar(tipo) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (tipo === 'todas') {
                mostrarPromociones(todasLasPromociones);
            } else if (tipo === 'vigentes') {
                const hoy = new Date();
                const vigentes = todasLasPromociones.filter(p => {
                    const fin = p.fecha_fin ? new Date(p.fecha_fin) : null;
                    return !fin || hoy <= fin;
                });
                mostrarPromociones(vigentes);
            }
        }

        /**
         * Abre el modal con el detalle de una promoción
         */
        function abrirModal(idPromocion) {
            const promo = todasLasPromociones.find(p => p.id_promocion === idPromocion);
            if (!promo) return;

            document.getElementById('detallePromocion').innerHTML = `
                <div class="modal-header">
                    <h2>Promoción #${promo.id_promocion}</h2>
                </div>
                <div class="modal-body">
                    <div class="detalle-precios">
                        <div class="precio-item">
                            <span>Precio Promocional:</span>
                            <strong style="color:#27ae60;font-size:24px">$${promo.precio}</strong>
                        </div>
                    </div>
                    <div class="detalle-info">
                        ${promo.fecha_inicio
                            ? `<p><strong>Período:</strong> ${promo.fecha_inicio} — ${promo.fecha_fin ?? 'Sin fecha'}</p>`
                            : ''}
                    </div>
                    <button class="btn btn-primary btn-block"
                        onclick="reservarPromo(${promo.id_ruta})">
                        Reservar Ahora
                    </button>
                </div>
            `;
            document.getElementById('modalPromocion').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('modalPromocion').style.display = 'none';
        }

        /**
         * Redirige a la búsqueda de vuelos de la ruta de la promoción
         */
        function reservarPromo(idRuta) {
            sessionStorage.setItem('rutaPromocion', idRuta);
            cerrarModal();
            window.location.href = 'vuelos.html';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modalPromocion');
            if (event.target === modal) modal.style.display = 'none';
        }
    </script>
</body>
</html>
