<!DOCTYPE html>
<html lang="es">
<head>
    <!--
    reservaciones.html — Gestión de reservaciones del cliente
    Conectado al API real — crea y consulta reservaciones
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECAir - Mis Reservaciones</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand"><h2>✈️ TECAir</h2></div>
            <ul class="navbar-menu">
                <li><a href="menu.html">Inicio</a></li>
                <li><a href="vuelos.html">Buscar Vuelos</a></li>
                <li><a href="reservaciones.html" class="active">Mis Reservaciones</a></li>
                <li><a href="promociones.html">Promociones</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="#" onclick="salir(); return false;">Cerrar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="reservaciones-section">
            <h1>Mis Reservaciones</h1>

            <!-- Tabs de navegación -->
            <div class="tabs-section">
                <button class="tab-btn active" onclick="cambiarTabReservaciones('activas')">
                    Reservaciones Activas
                </button>
                <button class="tab-btn" onclick="cambiarTabReservaciones('nueva')">
                    Nueva Reservación
                </button>
            </div>

            <!-- Alertas -->
            <div id="alertError" class="alert alert-error"></div>
            <div id="alertSuccess" class="alert alert-success"></div>

            <!-- Spinner -->
            <div id="loading" class="loading" style="display:none;">
                <div class="spinner"></div>
                <p>Procesando...</p>
            </div>

            <!--
            TAB 1: RESERVACIONES ACTIVAS
            Carga las reservaciones del usuario desde el API
            -->
            <div id="activasTab" class="tab-content active">
                <div id="listadoActivas" class="reservaciones-grid">
                    <div class="empty-state">
                        <p>Cargando reservaciones...</p>
                    </div>
                </div>
            </div>

            <!--
            TAB 2: NUEVA RESERVACIÓN
            Crea una reservación con el vuelo seleccionado
            -->
            <div id="nuevaTab" class="tab-content">
                <div class="card">
                    <h3>Nueva Reservación</h3>
                    <form id="formReservacion" class="form-grid">
                        <!-- Selector de vuelo — se llena con vuelos del API -->
                        <div class="form-group">
                            <label for="vueloSeleccionado">Vuelo <span style="color:red">*</span></label>
                            <select id="vueloSeleccionado" name="vueloSeleccionado" required>
                                <option value="">-- Selecciona un vuelo --</option>
                            </select>
                        </div>

                        <!-- Asiento -->
                        <div class="form-group">
                            <label for="asiento">Asiento <span style="color:red">*</span></label>
                            <input type="text" id="asiento" name="asiento"
                                placeholder="Ej: 12A" required>
                        </div>

                        <div class="form-group col-full">
                            <button type="button" class="btn btn-primary"
                                onclick="procederPago()">
                                Proceder al Pago
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 TECAir. Instituto Tecnológico de Costa Rica. Todos los derechos reservados.</p>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            if (!estaAutenticado()) {
                window.location.href = 'index.html';
                return;
            }

            // Carga vuelos y reservaciones al abrir la página
            await cargarVuelos();
            await cargarReservaciones();

            // Si viene un vuelo preseleccionado desde vuelos.html, lo precarga
            const vueloGuardado = sessionStorage.getItem('vueloSeleccionado');
            if (vueloGuardado) {
                const vuelo = JSON.parse(vueloGuardado);
                const select = document.getElementById('vueloSeleccionado');
                // Selecciona la opción que corresponde al vuelo
                for (let opt of select.options) {
                    if (opt.value == vuelo.id_vuelo) {
                        opt.selected = true;
                        break;
                    }
                }
                // Cambia al tab de nueva reservación
                cambiarTabReservaciones('nueva');
                sessionStorage.removeItem('vueloSeleccionado');
            }
        });

        /**
         * Carga los vuelos disponibles y llena el selector
         */
        async function cargarVuelos() {
            try {
                const data = await obtenerVuelos();
                const vuelos = (data.vuelos ?? []).filter(v => v.estado === 'abierto');
                const select = document.getElementById('vueloSeleccionado');

                vuelos.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.id_vuelo;
                    opt.textContent = `#${v.id_vuelo} — ${v.origen} → ${v.destino} — ${v.fecha_salida} ${v.hora_salida} — $${v.precio}`;
                    select.appendChild(opt);
                });
            } catch (error) {
                mostrarAlerta('Error al cargar vuelos', 'error');
            }
        }

        /**
         * Carga las reservaciones del usuario actual desde el API
         */
        async function cargarReservaciones() {
            const usuario = obtenerUsuarioActual();
            if (!usuario) return;

            try {
                const data = await apiGet('reservaciones');
                // Filtra las reservaciones del usuario actual
                const reservaciones = (data.reservaciones ?? [])
                    .filter(r => Number(r.id_usuario) === Number(usuario.id_usuario));

                const activasDiv = document.getElementById('listadoActivas');

                if (reservaciones.length === 0) {
                    activasDiv.innerHTML = `
                        <div class="empty-state">
                            <p>No tienes reservaciones activas</p>
                            <button class="btn btn-primary"
                                onclick="cambiarTabReservaciones('nueva')">
                                Hacer nueva reservación
                            </button>
                        </div>`;
                    return;
                }

                let html = '';
                reservaciones.forEach(res => {
                    html += `
                        <div class="reservacion-card">
                            <div class="reservacion-header">
                                <h3>Reservación #${res.id_reservacion}</h3>
                                <span class="estado-badge">${res.estado}</span>
                            </div>
                            <div class="reservacion-body">
                                <p><strong>Vuelo:</strong> #${res.id_vuelo}</p>
                                <p><strong>Estado:</strong> ${res.estado}</p>
                                <p><strong>Fecha:</strong> ${res.fecha_reservacion?.split('T')[0] ?? ''}</p>
                            </div>
                            <div class="reservacion-actions">
                                ${res.estado === 'pendiente_pago'
                                    ? `<button class="btn btn-sm btn-primary"
                                            onclick="pagarReservacion(${res.id_reservacion}, ${res.id_vuelo})">
                                            Pagar
                                       </button>`
                                    : ''}
                                <button class="btn btn-sm btn-danger"
                                    onclick="cancelar(${res.id_reservacion})">
                                    Cancelar
                                </button>
                            </div>
                        </div>`;
                });
                activasDiv.innerHTML = html;
            } catch (error) {
                mostrarAlerta('Error al cargar reservaciones', 'error');
            }
        }

        /**
         * Crea la reservación y redirige al pago
         */
        async function procederPago() {
            const idVuelo = document.getElementById('vueloSeleccionado').value;
            const asiento = document.getElementById('asiento').value.trim();
            const usuario = obtenerUsuarioActual();

            if (!idVuelo || !asiento) {
                mostrarAlerta('Por favor completa todos los campos', 'error');
                return;
            }

            document.getElementById('loading').style.display = 'flex';
            try {
                // Crea la reservación en el API
                const resultado = await crearReservacion({
                    id_usuario: usuario.id_usuario,
                    id_vuelo:   parseInt(idVuelo),
                    estado:     'pendiente_pago',
                });

                const reservacion = resultado.reservacion ?? resultado;

                // Guarda los datos del pago en sessionStorage
                sessionStorage.setItem('reservacionPago', JSON.stringify({
                    id_reservacion: reservacion.id_reservacion,
                    id_vuelo:       parseInt(idVuelo),
                    asiento,
                }));

                mostrarAlerta('Reservación creada. Redirigiendo al pago...', 'success');
                setTimeout(() => window.location.href = 'pago.html', 1500);
            } catch (error) {
                mostrarAlerta(error.message || 'Error al crear reservación', 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        /**
         * Redirige al pago de una reservación existente
         */
        function pagarReservacion(idReservacion, idVuelo) {
            sessionStorage.setItem('reservacionPago', JSON.stringify({
                id_reservacion: idReservacion,
                id_vuelo:       idVuelo,
            }));
            window.location.href = 'pago.html';
        }

        /**
         * Cancela una reservación
         */
        async function cancelar(idReservacion) {
            if (!confirm('¿Estás seguro que deseas cancelar esta reservación?')) return;
            document.getElementById('loading').style.display = 'flex';
            try {
                await cancelarReservacion(idReservacion);
                mostrarAlerta('Reservación cancelada correctamente', 'success');
                await cargarReservaciones();
            } catch (error) {
                mostrarAlerta(error.message || 'Error al cancelar', 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function cambiarTabReservaciones(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const tabs = ['activas', 'nueva'];
            document.querySelectorAll('.tab-btn')[tabs.indexOf(tab)].classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
        }

        function mostrarAlerta(mensaje, tipo) {
            const alertError   = document.getElementById('alertError');
            const alertSuccess = document.getElementById('alertSuccess');
            if (tipo === 'error') {
                alertError.textContent = mensaje;
                alertError.classList.add('show');
                alertSuccess.classList.remove('show');
                setTimeout(() => alertError.classList.remove('show'), 5000);
            } else {
                alertSuccess.textContent = mensaje;
                alertSuccess.classList.add('show');
                alertError.classList.remove('show');
                setTimeout(() => alertSuccess.classList.remove('show'), 5000);
            }
        }
    </script>
</body>
</html>
